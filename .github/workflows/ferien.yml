name: Ferien Bayern
on:
  schedule:
    - cron: "23 4 3 * *"
  push:
    branches: [main]
    paths: [".github/workflows/ferien.yml", "src/ferien.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ferien:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 src/ferien.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add ferien.json
          git diff --cached --quiet || (git commit -m "Ferien Bayern aktualisiert" && git pull --rebase origin main && git push origin main)
