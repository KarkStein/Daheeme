<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: eine schmale App-Spalte, oben Wochen-Scoreboard, darunter Aufgabenkarten mit tippbaren Häkchen-Slots; Tabs unten fixiert */
:root{padding-top:env(safe-area-inset-top,0px);
  --bg:#f3eee3; --surface:#fffdf7; --surface-2:#ebe4d4; --fg:#1c2a3a; --muted:#6a665b; --line:#e0d8c6;
  --ink:#1f3b5c; --lemon:#e8b44c; --lemon-ink:#3a2a00; --navy-a:#1f3b5c; --navy-b:#162c46; --ochre:#9a6a24;
  --p0:#1c8577; --p0-soft:#d3eee9; --p1:#c96a1e; --p1-soft:#fbe5d0;
  --both:#5f6396; --both-soft:#e3e4f3; --ho:#667616; --ho-soft:#e9eecb;
  --done:#2f7d5b; --done-soft:#d9efe4; --board-a:#1f3b5c; --board-b:#162c46;
  --shadow:0 1px 0 rgba(31,59,92,.06),0 3px 10px rgba(31,59,92,.07);
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; --r-s:8px;
  /* Raster (Florian 15.11.2026): 5 Schriftgrößen, 5 Abstände, 3 Rundungen (--r-s, --r, 999px) */
  --fs-xs:.75rem; --fs-s:.85rem; --fs-m:1rem; --fs-l:1.15rem; --fs-xl:1.45rem;
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:24px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1722; --surface:#172231; --surface-2:#1f2c3d; --fg:#ece6d8; --muted:#a39e90; --line:#2a3a4e;
  --ink:#a9c6e8; --lemon:#e8b44c; --lemon-ink:#2a1a00; --navy-a:#1f3b5c; --navy-b:#162c46; --ochre:#e0b46a;
  --p0:#4fc4b3; --p0-soft:#143630; --p1:#f0a05a; --p1-soft:#40280f;
  --both:#a9adde; --both-soft:#272a48; --ho:#c2d166; --ho-soft:#2c3311;
  --done:#58c493; --done-soft:#173528; --board-a:#1f3b5c; --board-b:#162c46;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1722; --surface:#172231; --surface-2:#1f2c3d; --fg:#ece6d8; --muted:#a39e90; --line:#2a3a4e;
  --ink:#a9c6e8; --lemon:#e8b44c; --lemon-ink:#2a1a00; --navy-a:#1f3b5c; --navy-b:#162c46; --ochre:#e0b46a;
  --p0:#4fc4b3; --p0-soft:#143630; --p1:#f0a05a; --p1-soft:#40280f;
  --both:#a9adde; --both-soft:#272a48; --ho:#c2d166; --ho-soft:#2c3311;
  --done:#58c493; --done-soft:#173528; --board-a:#1f3b5c; --board-b:#162c46;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.app{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 110px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.6rem;font-weight:800}
h2{font-size:var(--fs-l);font-weight:800}
.eyebrow{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.weeknav{display:flex;align-items:center;gap:6px}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:var(--fs-l)}
.iconbtn:disabled{opacity:.35;cursor:default}
.me{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.me span{font-size:var(--fs-s);color:var(--muted)}
.chipbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:var(--fs-s)}
.chipbtn[aria-pressed="true"].p0{background:var(--p0);border-color:var(--p0);color:var(--surface)}
.chipbtn[aria-pressed="true"].p1{background:var(--p1);border-color:var(--p1);color:var(--surface)}
.chipbtn[aria-pressed="true"].neutral{background:var(--fg);border-color:var(--fg);color:var(--bg)}
/* Scoreboard */
.board{background:linear-gradient(135deg,var(--board-a),var(--board-b));color:#fff;box-shadow:var(--shadow);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;position:relative;overflow:hidden}
.board .who{display:flex;flex-direction:column;gap:2px;min-width:0}
.board .who.right{text-align:right;align-items:flex-end}
.board button.who{background:none;border:none;color:inherit;font:inherit;text-align:left;padding:0;align-items:flex-start}
.board button.who.right{text-align:right;align-items:flex-end}
.board .name{font-weight:700;font-size:var(--fs-s);opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .pts{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1}.board .pts small{font-size:var(--fs-m);opacity:.75;font-weight:600}
.board .sub{font-size:var(--fs-xs);opacity:.75}
.ring{width:84px;height:84px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-weight:800;font-family:var(--f-display);font-size:var(--fs-m);line-height:1}
.ring .lbl small{display:block;font-family:var(--f-body);font-weight:600;font-size:.62rem;opacity:.8;margin-top:2px}
.balance{grid-column:1/-1;display:flex;flex-direction:column;gap:5px}
.balbar{height:8px;border-radius:999px;background:rgba(255,255,255,.22);overflow:hidden;display:flex}
.balbar i{display:block;height:100%}
.balrow{display:flex;justify-content:space-between;font-size:var(--fs-xs);opacity:.85;gap:8px}
.streak{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:var(--fs-s);font-weight:600;background:var(--surface);border:1px solid var(--line)}
.pill.lemon{background:var(--lemon);color:var(--lemon-ink);border-color:transparent}
.filters{display:flex;gap:6px;flex-wrap:wrap}
/* Sections and tasks */
.section{display:flex;flex-direction:column;gap:8px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.task{box-shadow:var(--shadow);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 14px;display:flex;flex-direction:column;gap:9px;position:relative}
.task.done{background:var(--surface-2);box-shadow:none}
.task-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.task-title{font-weight:600;min-width:0}
.task.done .task-title{color:var(--muted);text-decoration:line-through}
.donesep{display:flex;align-items:center;gap:10px;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted);margin-top:4px}
.donesep::before,.donesep::after{content:"";flex:1;height:1px;background:var(--line)}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px}
.owner{font-size:var(--fs-xs);font-weight:700;border-radius:var(--r-s);padding:2px 7px;white-space:nowrap}
.owner.p0{background:var(--p0-soft);color:var(--p0)}
.owner.p1{background:var(--p1-soft);color:var(--p1)}
.owner.both{background:var(--both-soft);color:var(--both)}
.owner.ho{background:var(--ho-soft);color:var(--ho)}
.freq{font-size:var(--fs-xs);color:var(--muted)}
.xp{font-weight:800;font-size:var(--fs-s);color:var(--lemon-ink);background:var(--lemon);border-radius:var(--r-s);padding:2px 7px;white-space:nowrap;flex:none}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slot{width:38px;height:38px;border-radius:50%;border:2px dashed var(--line);background:transparent;display:grid;place-items:center;font-size:var(--fs-xs);font-weight:700;color:var(--muted);position:relative;transition:transform .15s}
.slot:active{transform:scale(.9)}
.slot.today{border-style:solid;border-color:var(--ink);color:var(--ink)}
.slot.future{opacity:.35}
.tasklink{margin-top:10px;font-size:var(--fs-s);display:inline-flex;width:auto;padding:6px 12px}
.tlink{border:none;background:none;padding:0 4px;font:inherit;font-size:var(--fs-s);color:var(--ink)}
.subgrp{display:flex;flex-wrap:wrap;align-items:center;gap:6px;width:100%}
.subn{font-size:var(--fs-xs);color:var(--muted);font-weight:700;min-width:22px}
.subbtn{border:2px dashed var(--line);background:transparent;border-radius:999px;padding:6px 12px;font:inherit;font-size:var(--fs-s);font-weight:600;color:var(--fg)}
.subbtn.on{border-style:solid;border-color:var(--done);background:var(--done-soft);color:var(--fg)}
.subgrp.all .subbtn{border-color:var(--done)}

.quicklist{display:grid;gap:8px;margin-top:6px}
.quickbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font:inherit;font-weight:600;color:var(--fg)}
.quickbtn .qi{font-size:var(--fs-xl);width:28px;text-align:center}
.suggedit .shop li{display:flex;align-items:center;gap:8px}
.suggin{flex:1;min-width:0;border:1px solid var(--line);border-radius:var(--r-s);padding:8px 10px;background:var(--surface);color:var(--fg);font:inherit}
.ghost.small{padding:4px 10px;font-size:var(--fs-s)}
.kmweek{display:grid;gap:10px}
.kmday{padding:12px 14px}
.kmday.today{border:2px solid var(--ink)}
.kmday.past{opacity:.8}
.kmhead{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.kmhead b{font-family:var(--f-display);font-size:var(--fs-m)}
.kmtoday{margin-left:auto;font-size:var(--fs-xs);font-weight:700;color:var(--surface);background:var(--ink);border-radius:999px;padding:2px 9px}
.kmgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kmrow{display:flex;flex-direction:column;gap:4px;background:var(--surface-2);border-radius:var(--r);padding:8px}
.kmic{font-size:var(--fs-l);line-height:1}
.kml{font-size:var(--fs-xs);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.kmlink{text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink);white-space:nowrap}
.kmv{font-size:var(--fs-s);line-height:1.3;overflow-wrap:anywhere}
.kmna{font-size:var(--fs-s);color:var(--muted);margin-top:3px}
.kmedit{border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.kmedit h3{margin:4px 0 6px;font-size:var(--fs-m)}
@media (max-width:360px){.kmgrid{grid-template-columns:1fr}}

.slot.future.hoslot{opacity:.85;border-style:dashed}
.slot.on{border-style:solid;color:#fff;font-size:var(--fs-s)}
.slot.on.p0{background:var(--p0);border-color:var(--p0)}
.slot.on.p1{background:var(--p1);border-color:var(--p1)}
.hotop{margin-top:4px}.hotop .task{margin-bottom:0}
.slot.hoslot{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.hogrp{display:grid;gap:6px}.hohalf{display:grid;grid-template-columns:1fr 1fr;gap:6px}.hohalf .quickbtn{font-size:var(--fs-s);font-weight:500;padding:10px}.quickbtn[aria-pressed=true]{border:2px solid var(--ink)}.slot sup{font-size:.55rem;margin-left:1px}
.slot.on.x{background:var(--muted);border-color:var(--muted);color:var(--surface)}
.slot.split{border-style:solid;color:var(--fg);background:linear-gradient(90deg,var(--L,transparent) 50%,var(--R,transparent) 50%)}
.slot.split.h0{--L:var(--p0)}
.slot.split.h1{--R:var(--p1)}
.slot.split.h0.h1{color:var(--surface);border-color:transparent;font-size:var(--fs-m)}
.slot.on.chk{background:var(--done);border-color:var(--done);font-size:var(--fs-m)}
:root[data-theme="dark"] .slot.on{color:#0d1514}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .slot.on{color:#0d1514}}
.bigcheck{display:flex;align-items:center;gap:10px;border:2px dashed var(--line);border-radius:var(--r);padding:8px 12px;background:transparent;font-weight:600;text-align:left;color:var(--muted)}
.bigcheck.on{border-style:solid;color:var(--fg)}
.bigcheck.on.p0{border-color:var(--p0);background:var(--p0-soft)}
.bigcheck.on.p1{border-color:var(--p1);background:var(--p1-soft)}
.bigcheck.on.chk{border-color:var(--done);background:var(--done-soft)}
.float{position:absolute;pointer-events:none;font-weight:800;font-family:var(--f-display);color:var(--lemon-ink);background:var(--lemon);border-radius:var(--r-s);padding:1px 6px;font-size:var(--fs-s);animation:up .9s ease-out forwards;z-index:3}
@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-34px)}}
@media (prefers-reduced-motion: reduce){.float{animation:none;opacity:0}.slot{transition:none}}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.notice{font-size:var(--fs-s);background:var(--surface-2);border-radius:var(--r-s);padding:10px 12px;color:var(--muted)}
.primary{background:var(--ink);color:var(--bg);border:none;border-radius:var(--r-s);padding:10px 16px;font-weight:700}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:9px 14px;font-weight:600}
.danger{color:var(--p1)}
/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
.tabs button{flex:1;max-width:160px;background:none;border:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:var(--fs-xs);font-weight:600;color:var(--muted)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-selected="true"]{color:var(--ink)}
/* Score tab */
.card{box-shadow:var(--shadow);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.level{display:flex;gap:14px;align-items:center}
.badge{width:64px;height:64px;border-radius:var(--r);background:var(--lemon);color:var(--lemon-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.8rem;flex:none}
.xpbar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--lemon)}
.chart{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;align-items:end;height:150px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:2px;min-width:0}
.bar i{display:block;border-radius:var(--r-s)}
.bar .b0{background:var(--p0)}.bar .b1{background:var(--p1)}
.bar.ok::after{content:"";}
.chart-x{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;font-size:var(--fs-xs);color:var(--muted);text-align:center}
.legend{display:flex;gap:14px;font-size:var(--fs-s);color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:var(--r-s);margin-right:5px;vertical-align:-1px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface-2);border-radius:var(--r);padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:var(--fs-xl)}
.alist{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column}
.alist li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-bottom:1px solid var(--line);padding:7px 0}
.alist li:last-child{border-bottom:none}
.alist li span:first-child{min-width:0}
.alist .freq{white-space:nowrap}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px}
.dot.p0{background:var(--p0)}.dot.p1{background:var(--p1)}.dot.both{background:var(--both)}.dot.ho{background:var(--ho)}
.camp{border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
.camp{position:relative}
.card a{color:var(--done)}
.spot{position:absolute;transform:translate(-50%,-50%);background:transparent;border:none;border-radius:var(--r);padding:0;-webkit-tap-highlight-color:rgba(255,255,255,.25)}
a.catbtn{text-decoration:none;display:inline-flex;align-items:center}
.camp{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.spot .lab{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(20,30,30,.82);color:#fff;font:600 10px/1.2 var(--f-body);padding:2px 5px;border-radius:var(--r-s);white-space:nowrap;pointer-events:none}
.wxdays{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.wxdays li{display:flex;flex-direction:column;align-items:center;padding:6px 2px;border-radius:var(--r);background:var(--bg);font-size:var(--fs-s);font-variant-numeric:tabular-nums}.wxdays b{font-weight:600}

<script>
(function(){
"use strict";
// ---------- Vorlage (nur per Knopf im leeren Zustand) ----------
const TEMPLATE={persons:["Florian","Judith"],rotOffset:0,tasks:[

 {id:"bad",name:"Bad putzen",owner:"rot",pack:"A",freq:"week",times:1,pts:5},
 {id:"muell",name:"Müll rausbringen",owner:"rot",pack:"A",freq:"week",times:3,pts:1},
 {id:"plastik",name:"Plastikmüll rausbringen",owner:"rot",pack:"A",freq:"week",times:1,pts:1},
 {id:"waesche",name:"Wäsche waschen, auf- und abhängen",owner:"rot",pack:"B",freq:"week",times:3,pts:3},
 {id:"saugen",name:"Saugen (nach Bedarf)",owner:"rot",pack:"B",freq:"week",times:2,pts:3},

 {id:"treppe",name:"Saugen komplett",subs:["Treppe","🤖","Oben"],owner:"rot",pack:"B",freq:"week",times:1,pts:1},
 {id:"mittag",name:"Gemeinsames Mittagessen",owner:"both",freq:"week",times:1,pts:2},
 {id:"eigenes",name:"Eigenes Zeug aufräumen (alles außer Schlafzimmer)",owner:"both",freq:"week",times:3,pts:1},
 {id:"kidwaesche",name:"Kinderkleidung einräumen",owner:"p1",freq:"week",times:3,pts:1},
 {id:"pflanzen-drinnen",name:"Pflanzen drinnen",owner:"p1",freq:"week",times:1,pts:2},
 {id:"pflanzen-draussen",name:"Pflanzen draußen",owner:"p0",freq:"week",times:2,pts:1},
 {id:"balkon",name:"Balkon",owner:"p0",freq:"week",times:1,pts:2},
 {id:"sz-saugen",name:"Staubsaugen Schlafzimmer",owner:"p0",freq:"week",times:1,pts:2},
 {id:"zimmer-drueben",name:"Zimmer drüben putzen",owner:"rot",freq:"month",pts:6},
 {id:"flaechen-1",name:"Flächen: Kommode und Fensterbank",owner:"p1",freq:"month",pts:2},
 {id:"flaechen-0",name:"Flächen: roter Schrank",owner:"p0",freq:"month",pts:2},
 {id:"buecherregal",name:"Bücherregal Wohnzimmer",owner:"p1",freq:"half",pts:6},
 {id:"grossputz",name:"Großputz (langes Wochenende)",owner:"p0",freq:"half",pts:48},
 {id:"center",name:"Center putzen",owner:"rot",freq:"year",pts:18}
]};
const FREQ_LABEL={day:"täglich",week:"pro Woche",month:"monatlich",half:"halbjährlich",year:"jährlich"};
const OWNER_LABEL={rot:"Im Wechsel",both:"Beide",ho:"Hausdienst"};
const LEVELS=["Chaos-Höhle","Studi-Bude","Ordentliche WG","Gemütliches Nest","Blitzblank-Wohnung","Wohlfühl-Zuhause","Hausmeister-Palast","Glanz-Villa","Putz-Schloss","Legendäres Heim"];
const DAYS=["Mo","Di","Mi","Do","Fr","Sa","So"];
const GOAL=0.8;

// ---------- Datum ----------
const DAY=864e5;
function startOfDay(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function mondayOf(d){const x=startOfDay(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();const w=Math.ceil(((t-Date.UTC(y,0,1))/DAY+1)/7);return {y,w}}
function wkKey(mon){const {y,w}=isoWeek(mon);return y+"-W"+String(w).padStart(2,"0")}
function mondayFromKey(k){const [y,w]=k.split("-W").map(Number);return addDays(mondayOf(new Date(y,0,4)),(w-1)*7)}
const REF=new Date(2024,0,1);
function weekIndex(mon){return Math.round((mon-REF)/(7*DAY))}
function periodOf(freq,mon){const th=addDays(mon,3);const y=th.getFullYear(),m=th.getMonth();
  if(freq==="month")return {id:y+"-"+m,idx:y*12+m};
  if(freq==="half")return {id:y+"-H"+(m<6?1:2),idx:y*2+(m<6?0:1)};
  if(freq==="year")return {id:""+y,idx:y};
  return {id:wkKey(mon),idx:weekIndex(mon)}}
const fmt=(d,o)=>d.toLocaleDateString("de-DE",o);

// ---------- Zustand ----------
const S={key:null,kitaSec:"termine",kitaDraft:null,kitaText:"",playMapOpen:false,playMapEdit:false,playMapText:"",playDraft:null,playSec:"spielplatz",projFilter:"",projText:"",tripTab:"ideen",tripDraft:null,tripFilter:"",packList:"main",packListNew:false,packText:"",ideas:null,shopCatEdit:null,lunchDraft:null,lunchOpen:null,lunchMapOpen:false,lunchMapEdit:false,lunchMapText:"",recDraft:null,recOpen:null,planEdit:null,planText:"",planRec:null,foodWeek:null,food:{},foodTab:"plan",shopText:"",store:null,mode:"loading",config:null,weeks:{},view:mondayOf(new Date()),tab:"camp",filter:"alle",hideDone:false,groupBy:"freq",me:null,draft:null,timedOut:false};
try{const m=localStorage.getItem("hq-me");if(m==="p0"||m==="p1")S.me=m;const f=localStorage.getItem("hq-filter");if(f==="meine")S.filter="meine";S.hideDone=localStorage.getItem("hq-hidedone")==="1";if(localStorage.getItem("hq-groupby")==="art")S.groupBy="art";const ft=localStorage.getItem("hq-foodtab");if(ft&&ft!=="shop"&&ft!=="mittag")S.foodTab=ft;}catch(e){}

// ---------- Speicher-Adapter ----------
function dbStore(db){
  const chains={};
  return {
    listen(onCfg,onWeeks,onErr){
      db.doc("config/main").onSnapshot(s=>onCfg(s.exists?s.data():null,s.metadata.fromCache),onErr);
      db.collection("weeks").limit(1000).onSnapshot(q=>{const w={};q.docs.forEach(d=>{w[d.id]=d.data()});onWeeks(w,q.metadata.fromCache)},onErr);
    },
    tick(wk,key,val){const run=async()=>{const ref=db.doc("weeks/"+wk);
        if(!S.weeks[wk]) await ref.set({wk,ticks:{[key]:val}}); else await ref.update({ticks:{[key]:val}});};
      chains[wk]=(chains[wk]||Promise.resolve()).then(run,run);return chains[wk]},
    saveConfig(cfg){return db.doc("config/main").set(cfg)}
  }
}

const SYNC_URL="https://haushalt-32464-default-rtdb.europe-west1.firebasedatabase.app";
function fbStore(base){
  let tree={},cbs=null,opened=false;
  const setAt=(p,data)=>{const parts=p.split("/").filter(Boolean);
    if(!parts.length){tree=(data&&typeof data==="object")?data:{};return}
    let o=tree;for(let i=0;i<parts.length-1;i++){if(typeof o[parts[i]]!=="object"||o[parts[i]]===null)o[parts[i]]={};o=o[parts[i]]}
    const last=parts[parts.length-1];if(data===null||data===undefined)delete o[last];else o[last]=data};
  const emit=()=>{if(!cbs)return;const c=tree.config||null;if(c&&c.tasks&&!Array.isArray(c.tasks))c.tasks=Object.values(c.tasks);
    cbs[0](c?JSON.parse(JSON.stringify(c)):null,!opened);cbs[1](JSON.parse(JSON.stringify(tree.weeks||{})),!opened);if(cbs[3])cbs[3](JSON.parse(JSON.stringify(tree.food||{})))};
  const send=async(method,p,body)=>{const r=await fetch(base+p+".json",{method,body:JSON.stringify(body)});if(!r.ok)throw {code:r.status===401||r.status===403?"invalid_argument":"unavailable"}};
  return {
    listen(a,b,onErr,d){cbs=[a,b,onErr,d];const es=new EventSource(base+".json");
      es.addEventListener("put",e=>{const d=JSON.parse(e.data);opened=true;setAt(d.path,d.data);S.timedOut=false;emit()});
      es.addEventListener("patch",e=>{const d=JSON.parse(e.data);Object.keys(d.data||{}).forEach(k=>setAt(d.path+"/"+k,d.data[k]));emit()});
      es.addEventListener("cancel",()=>onErr({code:"revoked"}));
      es.onerror=()=>{if(opened){S.timedOut=true;render();return}
        fetch(base+"/probe.json").then(r=>{S.dbError=(r.status===401||r.status===403)?"rules":(r.ok?null:"offline")},()=>{S.dbError="offline"}).then(()=>{if(S.dbError==="rules")es.close();render()})};es.onopen=()=>{if(S.timedOut){S.timedOut=false;render()}}},
    async tick(wk,key,val){const prev=(tree.weeks&&tree.weeks[wk]&&tree.weeks[wk].ticks||{})[key];
      setAt("weeks/"+wk+"/ticks/"+key,val);emit();
      try{await send("PATCH","/weeks/"+wk+"/ticks",{[key]:val})}catch(e){setAt("weeks/"+wk+"/ticks/"+key,prev===undefined?null:prev);emit();throw e}},
    saveConfig(cfg){return send("PUT","/config",cfg)},
    async setPath(p,val){let prev=tree;p.split("/").forEach(k=>{prev=prev==null?undefined:prev[k]});prev=prev===undefined?null:JSON.parse(JSON.stringify(prev));
      setAt(p,val);emit();try{await send("PUT","/"+p,val)}catch(e){setAt(p,prev);emit();throw e}}
  }
}
function houseKey(){let k=null;const m=location.hash.match(/k=([A-Za-z0-9_-]{12,64})/);if(m)k=m[1];
  try{if(k)localStorage.setItem("hq-key",k);else k=localStorage.getItem("hq-key")}catch(e){}
  if(k&&!m){try{history.replaceState(null,"","#k="+k)}catch(e){}}return k}
function newKey(){const a=new Uint8Array(18);crypto.getRandomValues(a);return Array.from(a,x=>"abcdefghijkmnopqrstuvwxyz23456789"[x%32]).join("")}
function inviteLink(){return location.href.split("#")[0]+"#k="+S.key}
function renderSetup(){return `<div><div class="eyebrow">Willkommen</div><h1>🏕️🧹</h1></div>
  <section class="card"><h2>Neuen Haushalt starten</h2><div>Du bekommst einen geheimen Link. Wer den Link hat, sieht und bearbeitet denselben Plan. Ein Konto braucht niemand.</div><div><button class="primary" data-act="newhouse">Haushalt starten</button></div></section>
  <section class="card"><h2>Schon eingeladen?</h2><div>Öffne den Link, den du bekommen hast, oder füge ihn hier ein.</div><div class="line" style="display:flex;gap:8px;flex-wrap:wrap"><input type="text" id="joinlink" placeholder="Link einfügen" style="flex:1 1 200px;min-width:0"><button class="ghost" data-act="join">Beitreten</button></div></section>`}
function localStore(){
  const K="hq-local-v1";let data={config:null,weeks:{}};
  try{const raw=localStorage.getItem(K);if(raw)data=JSON.parse(raw)}catch(e){}
  let cbs=null;const save=()=>{try{localStorage.setItem(K,JSON.stringify(data))}catch(e){}};
  const emit=()=>{if(cbs){cbs[0](data.config,false);cbs[1](JSON.parse(JSON.stringify(data.weeks)),false);if(cbs[3])cbs[3](JSON.parse(JSON.stringify(data.food||{})))}};
  return {
    listen(a,b,c,d){cbs=[a,b,c,d];emit()},
    async tick(wk,key,val){data.weeks[wk]=data.weeks[wk]||{wk,ticks:{}};data.weeks[wk].ticks[key]=val;save();emit()},
    async saveConfig(cfg){data.config=cfg;save();emit()},
    async setPath(p,val){const parts=p.split("/");let o=data;for(let i=0;i<parts.length-1;i++){if(typeof o[parts[i]]!=="object"||o[parts[i]]===null)o[parts[i]]={};o=o[parts[i]]}
      if(val===null)delete o[parts[parts.length-1]];else o[parts[parts.length-1]]=val;save();emit()}
  }
}

// ---------- Logik ----------
function tasks(){return (S.config&&S.config.tasks)||[]}
function pname(p){const ps=(S.config&&S.config.persons)||TEMPLATE.persons;return p==="p0"?ps[0]:ps[1]}
function slotsOf(t){return t.freq==="day"?7:t.freq==="week"?Math.max(1,t.times|0||1):1}
function load(t){return (t.pts||0)*slotsOf(t)}
function group(f){return f==="day"||f==="week"?"week":f}
// Rotationsaufgaben je Rhythmus in zwei gleich schwere Pakete A/B teilen
function rotSplit(){const res={};
  ["week","month","half","year"].forEach(g=>{const all=tasks().filter(t=>t.owner==="rot"&&group(t.freq)===g);
    let a=0,b=0;all.forEach(t=>{if(t.pack==="A"){res[t.id]="A";a+=load(t)}else if(t.pack==="B"){res[t.id]="B";b+=load(t)}});
    all.filter(t=>t.pack!=="A"&&t.pack!=="B").sort((x,y)=>load(y)-load(x)).forEach(t=>{if(a<=b){res[t.id]="A";a+=load(t)}else{res[t.id]="B";b+=load(t)}})});
  return res}
// Gerade ISO-KW / gerader Monat / gerades Jahr: Paket A -> Person 1 (Florian), Paket B -> Person 2
function rotParity(freq,mon){const th=addDays(mon,3);
  if(group(freq)==="week")return isoWeek(mon).w%2;
  if(freq==="month")return (th.getMonth()+1)%2;
  if(freq==="half")return th.getMonth()<6?1:0;
  return th.getFullYear()%2}
function ownerFor(t,mon,split){
  if(t.owner!=="rot")return t.owner;
  const flip=(rotParity(t.freq,mon)+((S.config&&S.config.rotOffset)|0))%2;
  const pack=(split||rotSplit())[t.id]||"A";
  return (pack==="A")===(flip===0)?"p0":"p1"}
function ticksOf(wk){return (S.weeks[wk]&&S.weeks[wk].ticks)||{}}
function periodTick(t,mon){const pid=periodOf(t.freq,mon).id;const key=t.id+"__p";
  for(const wk in S.weeks){const v=ticksOf(wk)[key];if(v&&periodOf(t.freq,mondayFromKey(wk)).id===pid)return {wk,v}}
  return null}
// Längere Rhythmen sind erst ab der Mitte ihres Zeitraums dran (Florian 15.11.2026): Monat ab dem 15., Halbjahr ab 1.4./1.10., Jahr ab 1.7.
function periodMid(freq,mon){const th=addDays(mon,3),y=th.getFullYear(),m=th.getMonth();
  if(freq==="month")return new Date(y,m,15);if(freq==="half")return new Date(y,m<6?3:9,1);return new Date(y,6,1)}
function periodDue(t,mon,ref){if(group(t.freq)==="week")return true;mon=mon||mondayOf(new Date());
  if(!ref){const cur=mondayOf(new Date());ref=+mon===+cur?startOfDay(new Date()):addDays(mon,6)}return ref>=periodMid(t.freq,mon)}
function weekScore(wk){const mon=mondayFromKey(wk);const tk=ticksOf(wk);const byId={};tasks().forEach(t=>byId[t.id]=t);
  const pts={p0:0,p1:0};
  for(const k in tk){const v=tk[k];if(!v)continue;const t=byId[k.split("__")[0]];if(!t)continue;if(v.by==="p0"||v.by==="p1")pts[v.by]+=t.pts||0}
  let due=0,done=0;const split=rotSplit();const assigned={p0:0,p1:0};
  tasks().forEach(t=>{if(group(t.freq)!=="week")return;const n=slotsOf(t);due+=n*(t.pts||0);
    for(let i=0;i<n;i++)if(tk[t.id+"__"+i])done+=t.pts||0;
    const o=ownerFor(t,mon,split);if(o==="p0"||o==="p1")assigned[o]+=load(t)});
  return {pts,due,done,pct:due?done/due:0,assigned}}
function allTime(){const tot={p0:0,p1:0};Object.keys(S.weeks).forEach(wk=>{const s=weekScore(wk);tot.p0+=s.pts.p0;tot.p1+=s.pts.p1});return tot}
function levelFor(xp){let n=0;const need=k=>Math.round(120*k*(k+1)/2);while(need(n+1)<=xp&&n<LEVELS.length-1)n++;return {n,cur:xp-need(n),span:need(n+1)-need(n)}}
function streak(){const cur=mondayOf(new Date());let s=0;let m=addDays(cur,-7);
  for(let i=0;i<200;i++){const sc=weekScore(wkKey(m));if(sc.pct>=GOAL){s++;m=addDays(m,-7)}else break}

function editBox(title,fields,onSave,onDel){S.mboxAt=Date.now();if(document.getElementById("mbox"))return;const V={};fields.forEach(f=>V[f.k]=f.type==="multi"?(f.val||[]).slice():f.val==null?"":f.val);

    <div class="btnrow">${fields.some(f=>f.type!=="note")?`<button class="primary" type="submit">Speichern</button>`:""}<button class="ghost" type="button" data-ebx="1">Abbrechen</button>${Array.isArray(onDel)?onDel.map((d,i)=>`<button class="ghost${d[2]?" danger":""}" type="button" data-ebdel="${i}">${esc(d[0])}</button>`).join(""):onDel?`<button class="ghost danger" type="button" data-ebdel="x">Löschen</button>`:""}</div></form></div>`};

const advNeed=x=>String(x&&x.need||"").split(/\n/).map(l=>l.trim()).filter(Boolean);

const advCals=()=>listOf(S.food&&S.food.advent).sort((a,b)=>(b.year||0)-(a.year||0)||(a.at||0)-(b.at||0));

function advDoors(cal){const raw=(S.food&&S.food.adoor)||{},o={};Object.keys(raw).forEach(k=>{const v=raw[k];if(v&&v.cal===cal&&v.day)o[v.day]=Object.assign({id:k},v)});return o}
const advForLbl=c=>c.for==="kid"?"Kind":pname(c.for);
// Füreinander: wer beschenkt wird, sieht ungeöffnete Türchen nicht

function advCur(){const L=advCals(),y=advYear();let c=S.advCal&&L.find(x=>x.id===S.advCal);if(!c)c=L.find(x=>x.year===y&&x.for===(S.me==="p0"?"p1":S.me==="p1"?"p0":"kid"))||L.find(x=>x.year===y&&x.for==="kid")||L.find(x=>x.year===y);return c||null}
async function advSet(cal,day,patch){const k=cal.id+"_"+day,cur=advDoors(cal.id)[day]||{};const v=Object.assign({cal:cal.id,day},cur,patch,{at:Date.now(),by:S.me||""});delete v.id;if(!v.name&&patch.name==null)v.name=cur.name||"";

// Verteilen: Wochenenden bekommen "Zusammen machen", 6. Nikolaus, 24. etwas Besonderes, Süßes sparsam
async function advFill(cal){const D=advDoors(cal.id),used=new Set(Object.values(D).map(x=>x.name.toLowerCase()));let pool=suggList("advent",ADV_IDEAS).map(x=>x.name).filter(n=>!used.has(n.toLowerCase()));
  const take=f=>{const i=pool.findIndex(n=>f(advKind(n)));if(i<0)return pool.length?pool.shift():null;return pool.splice(i,1)[0]};let n=0,sweet=0;
  for(let d=1;d<=24;d++){if(D[d])continue;let name;const wd=new Date(cal.year||advYear(),11,d).getDay();
    if(d===6)name="Nikolaus: Stiefel mit Mandarine und Nüssen";else if(d===24)name=take(k=>k==="buch")||take(()=>1);
    else if(cal.for==="kid"&&(wd===0||wd===6))name=take(k=>k==="aktiv");else{name=take(k=>k==="suess"?sweet<Math.floor(d/4)+1:k!=="aktiv");if(name&&advKind(name)==="suess")sweet++}
    if(!name)break;await advSet(cal,d,{name,kind:advKind(name)});n++}
  toast(n?n+" Türchen gefüllt":"Keine freien Türchen oder keine Ideen mehr");render()}
// Inhaltsverzeichnis (gekaufter Kalender) oder Liste: "3: Schoko", "Tür 3 Schoko", "3. Schoko" oder einfach Zeilen der Reihe nach
function advParse(txt){return String(txt||"").split(/\n/).map(l=>l.replace(/^[\s•*\-–]+/,"").trim()).filter(Boolean).map(l=>{const m=l.match(/^(?:t(?:ü|ue)r(?:chen)?|tag|nr\.?)?\s*(\d{1,2})\s*[:.)\-–]?\s+(.+)$/i);return m&&+m[1]>=1&&+m[1]<=24?{day:+m[1],name:m[2].trim().slice(0,80)}:{day:0,name:l.slice(0,80)}}).filter(x=>x.name&&!/^(inhalt|inhaltsverzeichnis|adventskalender)\b/i.test(x.name))}
async function advImport(cal,lines){const D=advDoors(cal.id),taken=new Set(Object.keys(D).map(Number));let n=0;
  for(const x of lines.map(l=>advParse(l)[0]).filter(Boolean)){let d=x.day;if(!d){d=1;while(taken.has(d)&&d<=24)d++}if(d>24)break;taken.add(d);await advSet(cal,d,{name:x.name,kind:advKind(x.name),st:"idee"});n++}
  toast(n+" Türchen übernommen");render()}
function advPick(cal,txt){const L=advParse(txt);if(!L.length){toast("Keine Zeilen gefunden.");return}S.advPaste=null;S.shopPick={to:{cal:cal.id},blocks:[{src:cal.name,lines:L.map(x=>x.day?x.day+": "+x.name:x.name)}],mode:"",sel:{}};render()}

function advTile(){const c=advCur(),D=c?advDoors(c.id):{},n=Object.keys(D).length,t=advToday(c);return `<button class="tile" data-pfilter="advent"><span class="te">🎄</span><span class="tn">Adventskalender</span><span class="tc">${!c?"noch keiner":t&&!advHidden(c,t)&&D[t]?"Heute "+t+": "+esc(D[t].name):n+" von 24 gefüllt"}</span></button>`}

  if(!mine){h+=`<div class="btnrow" style="margin-top:10px">${buy?"":`<button class="ghost" data-act="advfill">🎲 Freie Türchen füllen</button>`}<button class="ghost" data-act="advpaste">📋 ${buy?"Inhaltsverzeichnis einfügen":"Liste einfügen"}</button>${buy?"":`<button class="ghost" data-act="advshopall">🛒 Was fehlt</button>`}</div>`;

// ---------- Funde bearbeiten, entfernen, verknüpfen (Florian 16.11.2026) ----------
// Ein Fund (food/fund) kann zusätzlich an anderer Stelle stehen. Verknüpfung in f.links {<ziel>: <id dort>}; Ziele hier austauschbar.
// geschenk = Geschenk-Idee unter Ideen (food/idea, cat geschenk, who, ref "fund:<id>"), einkauf = Einkaufsliste, wichtig = Erinnerung.
const FUND_LINKS={
  geschenk:{lbl:"🎁 Geschenke",nav:"projekte|pf:geschenk",has:id=>!!projs().find(x=>x.id===id),
    make:async(f,o)=>{const id=newId("p");await S.store.setPath("food/idea/"+id,{name:f.name,cat:"geschenk",state:"idee",who:o.who||null,link:f.link||null,ref:"fund:"+f.id,at:Date.now(),by:S.me||""});return id},
    sync:async(id,f)=>{await S.store.setPath("food/idea/"+id+"/name",f.name);await S.store.setPath("food/idea/"+id+"/link",f.link||null)},
    drop:async id=>S.store.setPath("food/idea/"+id,null)},
  einkauf:{lbl:"🧺 Einkaufsliste",nav:"einkauf|",has:id=>!!shopItems().find(x=>x.id===id&&!x.done),
    make:async f=>{const id="i"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);await S.store.setPath("food/shop/"+id,{name:f.name.slice(0,80),done:false,at:Date.now(),by:S.me||"",src:"Projekt: "+fundProjName(f)});return id},
    sync:async(id,f)=>S.store.setPath("food/shop/"+id+"/name",f.name.slice(0,80)),
    drop:async id=>S.store.setPath("food/shop/"+id,null)},
  wichtig:{lbl:"🔔 Wichtig",nav:"wichtig|",has:id=>!!prios().find(x=>x.id===id),
    make:async f=>{const id=newId("w");await S.store.setPath("food/prio/"+id,{name:f.name.slice(0,80),from:f.area==="haus"?"amhaus":"reisen",ref:f.proj?"hproj:"+f.proj:f.reise?"urlaub:"+f.reise:null,at:Date.now(),by:S.me||""});return id},
    sync:async(id,f)=>S.store.setPath("food/prio/"+id+"/name",f.name.slice(0,80)),
    drop:async id=>S.store.setPath("food/prio/"+id,null)}};
function fundProjName(f){const ar=f.area||"reise",A=FAREA[ar],p=f[A.key]&&A.projs().find(y=>y.id===f[A.key]);return p?p.name:A.title.replace(/^\S+\s/,"")}
const fundLinked=f=>Object.keys(FUND_LINKS).filter(k=>f.links&&f.links[k]&&FUND_LINKS[k].has(f.links[k]));
// Vorschlag, wohin ein Fund passt (Florian: vorschlagen, aber selbst auswählen)
function fundSugg(f){const t=((f.name||"")+" "+(f.link||"")).toLowerCase(),out=[];
  if(f.kind==="spielzeug"||/geschenk|tonie|lego|duplo|playmobil|puzzle|spielzeug|kuscheltier|buch|bilderbuch|gutschein/.test(t))out.push("geschenk");
  if(/drogerie|dm\b|rossmann|lebensmittel|reiniger|putzmittel/.test(t))out.push("einkauf");
  return out.filter(k=>!fundLinked(f).includes(k))}
async function fundSetLinks(f,want,o){const L=Object.assign({},f.links||{});
  for(const k of Object.keys(FUND_LINKS)){const on=fundLinked(f).includes(k),w=want.includes(k);

  await S.store.setPath("food/fund/"+f.id+"/links",Object.keys(L).length?L:null)}

      else out.push({date,name,kind:kitaKindGuess(name),note:[tm?tm+" Uhr":"",loc].filter(Boolean).join(" · ")})});return out}

  t.split(/\r?\n/).forEach(l=>{const m=l.match(/(\d{1,2})\.\s?(\d{1,2})\.(\d{2,4})?(?:\s*(?:-|–|bis)\s*(\d{1,2})\.\s?(\d{1,2})\.(\d{2,4})?)?/);if(!m)return;
    let name=l.replace(m[0],"").replace(/^[\s,:;–-]+|[\s,:;–-]+$/g,"").replace(/^(mo|di|mi|do|fr|sa|so)\.?,?\s+/i,"").trim().slice(0,80);if(!name)return;

// Vorschlag nur bei bekannten Rezept-Seiten; Instagram und Unbekanntes ohne Vorwahl. Beschreibung optional; enthält sie eine Liste, lässt sie sich in einzelne Einträge aufteilen (jeder behält den Link).
const SHARE_REC_RX=/(chefkoch|kitchenstories|emmikochteinfach|kptncook|eat-this|zuckerundjagdwurst|chiliundciabatta|essen-und-trinken|lecker\.de|springlane|eatsmarter|einfachbacken|gutekueche|kochbar|bbcgoodfood|allrecipes|hellofresh|cookidoo|kuechengoetter|rewe\.de\/rezepte|\/rezept|\/recipe)/i;
const SHARE_FIX=[["rezept","📖","Rezept"],["spiel","🧩","Spielidee"],["ausflug","🚲","Ausflug"],["geschenk","🎁","Geschenk-Idee"]];
function shareTargets(){return SHARE_FIX.map(x=>x.slice())
  .concat(hprojs().filter(x=>x.state!=="erledigt").map(x=>["proj:"+x.id,x.emo||"🛠️","Projekt: "+x.name]))
  .concat(buyLists().map(L=>["liste:"+L.id,L.emo,"Liste: "+L.name]))}
const URL_RX=/https?:\/\/\S+/gi;
function shareSplit(text){const L=String(text||"").split(/\r?\n/).map(s=>s.replace(URL_RX,"").trim()).filter(s=>s&&!/^(#\S+\s*)+$/.test(s));
  const MK=/^(?:\d{1,2}\s*[.):]|[-•*–·▪►✓✔→]|(?:\p{Extended_Pictographic}|\p{Regional_Indicator})[️‍\p{Extended_Pictographic}]*)\s*(.+)$/u;
  const marked=L.map(s=>{const m=MK.exec(s);return m?m[1].trim():null}).filter(s=>s&&s.length>1);
  if(marked.length>=2)return marked.map(s=>s.slice(0,80));
  const short=L.filter(s=>s.length<=60);if(L.length>=3&&short.length===L.length)return L.map(s=>s.slice(0,80));return []}

// Nach der Wahl bleiben die übrigen Möglichkeiten in alt, so lässt sich die Wahl später ändern oder neu fragen.
const altOf=x=>Object.values((x&&x.alt)||{}).filter(o=>o&&/^\d{4}-\d{2}-\d{2}$/.test(o.date||""));
const CHOICE_KINDS={
  termin:{path:"termin",list:()=>termine(),icon:"📅",
    opts:x=>[{date:x.date,time:x.time||"",tend:x.tend||""}].concat(altOf(x).map(o=>({date:o.date,time:o.time||"",tend:o.tend||""}))),
    label:o=>WD2[ymdD(o.date).getDay()]+" "+rDate(o.date)+(o.time?" "+o.time:"")+(o.tend?" bis "+o.tend:""),
    pick:(x,i)=>{const O=CHOICE_KINDS.termin.opts(x),c=O[i];return {date:c.date,time:c.time||null,tend:c.tend||null,alt:O.filter((_,j)=>j!==i).map(o=>({date:o.date,time:o.time||null,tend:o.tend||null}))}},
    edit:x=>{goNav("woche|wp:3");S.terDraft=terDraftOf(x);render();window.scrollTo(0,0)},
    nav:"woche|wp:3"}};
const choiceOther=p=>p==="p0"?"p1":p==="p1"?"p0":"";
const choiceWhoTxt=a=>a.who==="both"?"Beide stimmen ab":(a.who===S.me?"Du wählst":pname(a.who)+" wählt");
function choiceAll(){const out=[];Object.keys(CHOICE_KINDS).forEach(k=>CHOICE_KINDS[k].list().forEach(x=>{if(x.ask&&altOf(x).length||x.told)out.push({k,x})}));return out}
// Für die Glocke: was ich wählen muss (mit Frist überfällig) und neue Hinweise „hat gewählt“
function choiceBell(){const me=S.me||"",A=[],N=[],W=[];choiceAll().forEach(c=>{const a=c.x.ask;
  if(a&&altOf(c.x).length){const v=a.votes||{};if(!me||a.who===me||(a.who==="both"&&v[me]==null))A.push(c);else W.push(c)}
  else if(c.x.told&&c.x.told.by!==me&&!((c.x.told.seen||{})[me||"x"]))N.push(c)});return {A,N,W}}
async function choiceSet(k,id,patch){const base="food/"+CHOICE_KINDS[k].path+"/"+id+"/";for(const f of Object.keys(patch))await S.store.setPath(base+f,patch[f])}
const choiceGet=(k,id)=>CHOICE_KINDS[k].list().find(y=>y.id===id);
async function choicePick(k,id,i){const K=CHOICE_KINDS[k],x=choiceGet(k,id);if(!x)return;const O=K.opts(x),txt=K.label(O[i]),me=S.me||"";

  await choiceSet(k,id,{ask:Object.assign({},x.ask,{who:to,votes:null,back:{by:me,at:Date.now()}})});toast("Zurück an "+pname(to)+": bitte neue Möglichkeiten.")}
function choiceOpen(k,id){const K=CHOICE_KINDS[k],x=choiceGet(k,id);if(!K||!x||document.getElementById("mbox"))return;const O=K.opts(x),a=x.ask&&O.length>1?x.ask:null,me=S.me||"",v=(a&&a.votes)||{},o=choiceOther(me),today=ymd(new Date());

  const el=document.createElement("div");el.id="mbox";S.mboxAt=Date.now();
  el.innerHTML=`<div class="mboxbg"></div><div class="mboxcard quickcard" role="dialog" aria-label="Möglichkeiten"><div class="section-head"><h2>${a?"🗳️":"✓"} ${esc(x.name)}</h2></div>${hint}
    <div class="chlist">${O.map((c,i)=>{const vs=["p0","p1"].filter(p=>v[p]===i);return `<button type="button" class="chipbtn neutral${!a&&!i?" chosen":""}" data-chpick="${i}" aria-pressed="${!a&&!i}"><span>${a?i+1+". ":""}${esc(K.label(c))}</span><span class="freq">${vs.map(p=>"✓ "+esc(pname(p))).join(" ")}${!a&&!i?"gewählt":""}</span></button>`}).join("")}</div>
    <div class="btnrow">${a&&a.who===me&&a.from&&a.from!==me||vote&&me?`<button class="ghost" type="button" data-chback>↩ Passt keiner</button>`:""}<button class="ghost" type="button" data-chedit>✎ ${a?"Bearbeiten":"Nochmal fragen oder ändern"}</button><button class="ghost" type="button" data-chx>Schließen</button></div></div>`;

function choiceCard(){const {A,N,W}=choiceBell(),today=ymd(new Date());if(!A.length&&!N.length&&!W.length)return "";
  const K=c=>CHOICE_KINDS[c.k],row=(c,txt,cls)=>`<div class="prow${cls?" "+cls:""}"><span class="pchk" aria-hidden="true">${K(c).icon}</span><button class="pnm" data-chopen="${c.k}|${esc(c.x.id)}">${esc(c.x.name)}<br><i>${txt}</i></button></div>`;
  let h=`<section class="card"><div class="section-head"><h2>🗳️ Bitte wählen</h2><span class="freq num">${A.length+N.length}</span></div>`;
  h+=A.map(c=>{const a=c.x.ask;return row(c,esc((a.who==="both"?"Abstimmen: ":"Bitte Termin wählen: ")+K(c).opts(c.x).length+" Möglichkeiten")+(a.due?` · Frist ${esc(dLabel(a.due))}`:"")+(a.back?" · ↩ passt keiner":""),a.due&&a.due<today?"due":"")}).join("");
  h+=N.map(c=>`<div class="prow"><span class="pchk" aria-hidden="true">✓</span><button class="pnm" data-chopen="${c.k}|${esc(c.x.id)}">${esc(c.x.name)}<br><i>${esc(pname(c.x.told.by))} hat ${esc(c.x.told.txt||"")} gewählt</i></button><button class="ghost small" data-chseen="${c.k}|${esc(c.x.id)}">Gesehen</button></div>`).join("");
  h+=W.map(c=>row(c,"⏳ Wartet auf "+esc(c.x.ask.who==="both"?pname(choiceOther(S.me)):pname(c.x.ask.who)),"later")).join("");
  return h+`</section>`}

const PUSH_PUB="BAQ4iz0ADZ-sTdXq3ug3t2zyA5myV8EDRluxepXnefRHxgHYu719jnlnjYCkrnDteKM7JxffVAe4k2_nxJnrLZw";
const pushOk=()=>"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;

function pushRow(){if(!pushOk())return `<div class="freq">Dieses Handy oder dieser Browser kann keine Benachrichtigungen. Auf Android geht es in Chrome mit installierter App.</div>`;
  const m=pushMine(),on=!!(m&&m.on&&Notification.permission==="granted");
  return `<div class="freq">Je Handy einzeln. Kommt: Morgen-Briefing um 7:00 und nur Akutes (Fälliges mit 🔔, Neues mit 🔔 vom anderen, „Bitte Termin wählen“). Der Versand wird gerade eingerichtet.</div>
    <div class="btnrow"><button class="${on?"ghost":"primary"}" data-act="pushtoggle">${on?"🔕 Auf diesem Handy aus":"🔔 Auf diesem Handy einschalten"}</button>${on?`<button class="ghost" data-act="pushtest">Testmeldung</button>`:""}</div>${Notification.permission==="denied"?`<div class="notice">Benachrichtigungen sind für die App gesperrt. Ändern: lange auf das App-Symbol › App-Info › Benachrichtigungen.</div>`:""}`}
const b64u=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");const r=atob(s+"===".slice((s.length+3)%4));return Uint8Array.from(r,c=>c.charCodeAt(0))};
async function pushToggle(){const dev=pushDev(),m=pushMine();
  if(m&&m.on){try{const r=await pushReg(),s=r&&await r.pushManager.getSubscription();if(s)await s.unsubscribe()}catch(_){}await S.store.setPath("food/push/"+dev+"/on",false);toast("Benachrichtigungen auf diesem Handy aus");render();return}
  if(!S.me){toast("Bitte erst unter Wir wählen, wer du bist.");return}
  const p=await Notification.requestPermission();if(p!=="granted"){toast("Nicht erlaubt. Ohne Erlaubnis keine Meldungen.");render();return}
  const r=await pushReg();if(!r){toast("Konnte den Hintergrund-Teil nicht starten.");return}await navigator.serviceWorker.ready;
  let s=await r.pushManager.getSubscription();if(!s)s=await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(PUSH_PUB)});
  await S.store.setPath("food/push/"+dev,{who:S.me,on:true,sub:JSON.parse(JSON.stringify(s)),at:Date.now(),ua:(navigator.userAgent.match(/Android[^;)]*|iPhone|Windows|Mac OS X/)||[""])[0]});

   +`<radialGradient id="sPaper" gradientUnits="userSpaceOnUse" cx="180" cy="148" r="225"><stop offset=".72" stop-color="${night?"#1b2430":"#f6f0e2"}" stop-opacity="0"/><stop offset="1" stop-color="${night?"#1b2430":"#f6f0e2"}" stop-opacity=".85"/></radialGradient>`;

  if(wk==="schnee"){let r="";for(let i=0;i<40;i++){const x=(i*97+i*i*13+11)%360,y=(i*61+i*i*29+7)%230+30;r+=`<circle cx="${x}" cy="${y}" r="${1.2+(i%3)*.5}"/>`}g+=`<g class="snow" fill="#fff" opacity=".9">${r}</g>`}
  g+=styTop(st==="aquarell"?st:st?"licht":"",night);
  if(st==="aquarell"){const k=g.indexOf("</defs>")+7;g=g.slice(0,k)+`<g filter="url(#sAq)">`+g.slice(k)+"</g>"}
  return `<svg viewBox="${HVB.join(" ")}" role="img" aria-label="Euer Haus in der Stadt"${styCss(st)}>${g}</svg>`}

// Teilen an die App (Florian 15./16.11.2026): Share Target aus manifest.json (?su=Link&sx=Text&st=Titel, unverändert) öffnet „Wohin damit?“ (29a-teilen.js)
function shareIn(){let q;try{q=new URLSearchParams(location.search)}catch(_){return}if(!q.has("su")&&!q.has("sx"))return;
  const st=(q.get("st")||"").trim(),sx=(q.get("sx")||"").trim(),su=(q.get("su")||"").trim();try{const u=new URL(location.href);["su","sx","st"].forEach(k=>u.searchParams.delete(k));history.replaceState(null,"",u.pathname+u.search+(S.key?"#k="+S.key:location.hash))}catch(_){}
  if(!st&&!sx&&!su)return;let n=0;const go=()=>{if((!S.config||!S.food)&&n++<20)return setTimeout(go,300);shareOpen(st,sx,su)};setTimeout(go,300)}

// ---------- Start ----------
function start(store,mode){S.store=store;S.mode=mode;let gotCfg=false,gotWeeks=false;
  const timer=setTimeout(()=>{S.timedOut=true;if(!gotCfg)S.config=S.config||null;render()},10000);
  store.listen((cfg,fromCache)=>{S.config=cfg;if(cfg&&!fromCache&&Array.isArray(cfg.tasks)&&!(cfg.mig&&cfg.mig.saug1))migSaugen(cfg);else if(cfg&&!fromCache&&Array.isArray(cfg.tasks)&&!(cfg.mig&&cfg.mig.bring1))migBring(cfg);if(!fromCache){gotCfg=true;S.cfgConfirmed=true}if(gotCfg&&gotWeeks){clearTimeout(timer);S.timedOut=false}render()},
    (w,fromCache)=>{S.weeks=w;if(!fromCache)gotWeeks=true;if(gotCfg&&gotWeeks){clearTimeout(timer);S.timedOut=false}render()},
    err=>{clearTimeout(timer);toast("Verbindung zu den gemeinsamen Daten verloren. Seite neu öffnen.")},
    food=>{S.food=food||{};migSpiel();migShopBell();if(S.tab==="essen"||S.tab==="privat"||S.tab==="post"||S.tab==="settings"||S.tab==="einkauf"||S.tab==="camp"||S.tab==="ausflug"||S.tab==="projekte"||S.tab==="amhaus"||S.tab==="spiel"||S.tab==="kita"||S.tab==="musik"||S.tab==="recherchen"||S.tab==="wichtig"||S.tab==="tag"||S.tab==="listen"||S.tab==="ausgaben"||S.tab==="reisen"||S.tab==="kind")render()});
  try{fetch("wochenideen.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{if(j&&Array.isArray(j.items)){S.wideas=j;if(S.tab==="essen")render()}}).catch(()=>{})}catch(_){}
  try{fetch("hausfunde.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{if(j&&Array.isArray(j.items)){S.hfunde=j;if(S.tab==="amhaus")render()}}).catch(()=>{})}catch(_){}
  shareIn();
  try{fetch("ferien.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{if(j&&Array.isArray(j.ferien)){S.ferien=j;render()}}).catch(()=>{})}catch(_){}
  try{fetch("ausflugtipps.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{if(j&&Array.isArray(j.items)){S.atipps=j;if(S.tab==="ausflug")render()}}).catch(()=>{})}catch(_){}
  try{fetch("reisefunde.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{if(j&&Array.isArray(j.items)){S.rfunde=j;if(S.tab==="ausflug")render()}}).catch(()=>{})}catch(_){}
  try{fetch("ideen.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{if(j&&Array.isArray(j.items)){S.ideas=j;if(S.tab==="essen")render()}}).catch(()=>{})}catch(_){}
}
function enter(k){S.key=k;try{localStorage.setItem("hq-key",k);history.replaceState(null,"","#k="+k)}catch(e){}
  start(fbStore(SYNC_URL+"/haushalt/"+k),"web");render()}
if(!SYNC_URL)start(localStore(),"local");else{const k=houseKey();if(k)enter(k);else{S.mode="setup";render()}}
window.addEventListener("hashchange",()=>{const m=location.hash.match(/k=([A-Za-z0-9_-]{12,64})/);if(m&&m[1]!==S.key)location.reload()});
})();
