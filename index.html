<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f4a40">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="🏕️🧹">
<meta name="application-name" content="🏕️🧹">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>html{color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>🏕️🧹</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: eine schmale App-Spalte, oben Wochen-Scoreboard, darunter Aufgabenkarten mit tippbaren Häkchen-Slots; Tabs unten fixiert */
:root{padding-top:env(safe-area-inset-top,0px);
  --bg:#f1f4f1; --surface:#ffffff; --surface-2:#e5ebe6; --fg:#1b2622; --muted:#5f6d67; --line:#d5ddd7;
  --ink:#1f4a40; --lemon:#f4b860; --lemon-ink:#4a3000;
  --p0:#1c8577; --p0-soft:#d3eee9; --p1:#c96a1e; --p1-soft:#fbe5d0;
  --both:#5f6396; --both-soft:#e3e4f3; --ho:#667616; --ho-soft:#e9eecb;
  --done:#2f7d5b; --done-soft:#d9efe4; --board-a:#1f4a40; --board-b:#2f6b5c;
  --shadow:0 1px 2px rgba(20,45,38,.06),0 4px 14px rgba(20,45,38,.05);
  --f-display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1513; --surface:#17201d; --surface-2:#1f2b27; --fg:#e6efeb; --muted:#94a59f; --line:#2b3934;
  --ink:#7fd1bd; --lemon:#f4b860; --lemon-ink:#2a1a00;
  --p0:#4fc4b3; --p0-soft:#143630; --p1:#f0a05a; --p1-soft:#40280f;
  --both:#a9adde; --both-soft:#272a48; --ho:#c2d166; --ho-soft:#2c3311;
  --done:#58c493; --done-soft:#173528; --board-a:#1f4a40; --board-b:#2f6b5c;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1513; --surface:#17201d; --surface-2:#1f2b27; --fg:#e6efeb; --muted:#94a59f; --line:#2b3934;
  --ink:#7fd1bd; --lemon:#f4b860; --lemon-ink:#2a1a00;
  --p0:#4fc4b3; --p0-soft:#143630; --p1:#f0a05a; --p1-soft:#40280f;
  --both:#a9adde; --both-soft:#272a48; --ho:#c2d166; --ho-soft:#2c3311;
  --done:#58c493; --done-soft:#173528; --board-a:#1f4a40; --board-b:#2f6b5c;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.app{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 110px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.6rem;font-weight:800}
h2{font-size:1.1rem;font-weight:800}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.weeknav{display:flex;align-items:center;gap:6px}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:1.1rem}
.iconbtn:disabled{opacity:.35;cursor:default}
.me{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.me span{font-size:.85rem;color:var(--muted)}
.chipbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.9rem}
.chipbtn[aria-pressed="true"].p0{background:var(--p0);border-color:var(--p0);color:var(--surface)}
.chipbtn[aria-pressed="true"].p1{background:var(--p1);border-color:var(--p1);color:var(--surface)}
.chipbtn[aria-pressed="true"].neutral{background:var(--fg);border-color:var(--fg);color:var(--bg)}
/* Scoreboard */
.board{background:linear-gradient(135deg,var(--board-a),var(--board-b));color:#fff;box-shadow:var(--shadow);border-radius:20px;padding:16px;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;position:relative;overflow:hidden}
.board .who{display:flex;flex-direction:column;gap:2px;min-width:0}
.board .who.right{text-align:right;align-items:flex-end}
.board button.who{background:none;border:none;color:inherit;font:inherit;text-align:left;padding:0;align-items:flex-start}
.board button.who.right{text-align:right;align-items:flex-end}
.board .name{font-weight:700;font-size:.9rem;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .pts{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1}.board .pts small{font-size:1rem;opacity:.75;font-weight:600}
.board .sub{font-size:.75rem;opacity:.75}
.ring{width:84px;height:84px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-weight:800;font-family:var(--f-display);font-size:1.05rem;line-height:1}
.ring .lbl small{display:block;font-family:var(--f-body);font-weight:600;font-size:.62rem;opacity:.8;margin-top:2px}
.balance{grid-column:1/-1;display:flex;flex-direction:column;gap:5px}
.balbar{height:8px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden;display:flex}
.balbar i{display:block;height:100%}
.balrow{display:flex;justify-content:space-between;font-size:.75rem;opacity:.85;gap:8px}
.streak{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:.82rem;font-weight:600;background:var(--surface);border:1px solid var(--line)}
.pill.lemon{background:var(--lemon);color:var(--lemon-ink);border-color:transparent}
.filters{display:flex;gap:6px;flex-wrap:wrap}
/* Sections and tasks */
.section{display:flex;flex-direction:column;gap:8px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.task{box-shadow:var(--shadow);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 14px;display:flex;flex-direction:column;gap:9px;position:relative}
.task.done{background:var(--surface-2);box-shadow:none}
.task-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.task-title{font-weight:600;min-width:0}
.task.done .task-title{color:var(--muted);text-decoration:line-through}
.donesep{display:flex;align-items:center;gap:10px;font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted);margin-top:4px}
.donesep::before,.donesep::after{content:"";flex:1;height:1px;background:var(--line)}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px}
.owner{font-size:.74rem;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap}
.owner.p0{background:var(--p0-soft);color:var(--p0)}
.owner.p1{background:var(--p1-soft);color:var(--p1)}
.owner.both{background:var(--both-soft);color:var(--both)}
.owner.ho{background:var(--ho-soft);color:var(--ho)}
.freq{font-size:.74rem;color:var(--muted)}
.xp{font-weight:800;font-size:.8rem;color:var(--lemon-ink);background:var(--lemon);border-radius:6px;padding:2px 7px;white-space:nowrap;flex:none}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slot{width:38px;height:38px;border-radius:50%;border:2px dashed var(--line);background:transparent;display:grid;place-items:center;font-size:.7rem;font-weight:700;color:var(--muted);position:relative;transition:transform .15s}
.slot:active{transform:scale(.9)}
.slot.today{border-style:solid;border-color:var(--ink);color:var(--ink)}
.slot.future{opacity:.35}
.slot.on{border-style:solid;color:#fff;font-size:.8rem}
.slot.on.p0{background:var(--p0);border-color:var(--p0)}
.slot.on.p1{background:var(--p1);border-color:var(--p1)}
.slot.split{border-style:solid;color:var(--fg);background:linear-gradient(90deg,var(--L,transparent) 50%,var(--R,transparent) 50%)}
.slot.split.h0{--L:var(--p0)}
.slot.split.h1{--R:var(--p1)}
.slot.split.h0.h1{color:var(--surface);border-color:transparent;font-size:1.05rem}
.slot.on.chk{background:var(--done);border-color:var(--done);font-size:1.05rem}
:root[data-theme="dark"] .slot.on{color:#0d1514}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .slot.on{color:#0d1514}}
.bigcheck{display:flex;align-items:center;gap:10px;border:2px dashed var(--line);border-radius:12px;padding:8px 12px;background:transparent;font-weight:600;text-align:left;color:var(--muted)}
.bigcheck.on{border-style:solid;color:var(--fg)}
.bigcheck.on.p0{border-color:var(--p0);background:var(--p0-soft)}
.bigcheck.on.p1{border-color:var(--p1);background:var(--p1-soft)}
.bigcheck.on.chk{border-color:var(--done);background:var(--done-soft)}
.float{position:absolute;pointer-events:none;font-weight:800;font-family:var(--f-display);color:var(--lemon-ink);background:var(--lemon);border-radius:8px;padding:1px 6px;font-size:.85rem;animation:up .9s ease-out forwards;z-index:3}
@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-34px)}}
@media (prefers-reduced-motion: reduce){.float{animation:none;opacity:0}.slot{transition:none}}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.notice{font-size:.85rem;background:var(--surface-2);border-radius:10px;padding:10px 12px;color:var(--muted)}
.primary{background:var(--ink);color:var(--bg);border:none;border-radius:10px;padding:10px 16px;font-weight:700}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:600}
.danger{color:var(--p1)}
/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
.tabs button{flex:1;max-width:160px;background:none;border:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;font-weight:600;color:var(--muted)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-selected="true"]{color:var(--ink)}
/* Score tab */
.card{box-shadow:var(--shadow);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.level{display:flex;gap:14px;align-items:center}
.badge{width:64px;height:64px;border-radius:18px;background:var(--lemon);color:var(--lemon-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.8rem;flex:none}
.xpbar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--lemon)}
.chart{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;align-items:end;height:150px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:2px;min-width:0}
.bar i{display:block;border-radius:4px}
.bar .b0{background:var(--p0)}.bar .b1{background:var(--p1)}
.bar.ok::after{content:"";}
.chart-x{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;font-size:.7rem;color:var(--muted);text-align:center}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface-2);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem}
.alist{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column}
.alist li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-bottom:1px solid var(--line);padding:7px 0}
.alist li:last-child{border-bottom:none}
.alist li span:first-child{min-width:0}
.alist .freq{white-space:nowrap}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px}
.dot.p0{background:var(--p0)}.dot.p1{background:var(--p1)}.dot.both{background:var(--both)}.dot.ho{background:var(--ho)}
.camp{border-radius:20px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
.camp{position:relative}
.card a{color:var(--done)}
.spot{position:absolute;transform:translate(-50%,-50%);background:transparent;border:none;border-radius:18px;padding:0;-webkit-tap-highlight-color:rgba(255,255,255,.25)}
a.catbtn{text-decoration:none;display:inline-flex;align-items:center}
.spot:focus-visible{outline:3px solid #fff;outline-offset:-3px}
.hot{position:absolute;transform:translate(-50%,-50%);background:var(--surface);color:var(--fg);border:none;border-radius:999px;padding:5px 11px;font-weight:700;font-size:.76rem;box-shadow:0 2px 8px rgba(0,0,0,.28);display:flex;gap:6px;align-items:center;white-space:nowrap;opacity:.94}
.hot.big{font-size:.92rem;padding:7px 12px;opacity:1}
.hot b{background:#f4b860;color:#1f2a26;border-radius:999px;padding:0 7px;font-size:.74rem;line-height:1.5}
.today{gap:0}
.todayrow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;border-top:1px solid var(--line);text-align:left;padding:12px 0;font-size:.97rem}
.todayrow:first-of-type{margin-top:8px}
.todayrow span:nth-child(2){flex:1;min-width:0}
.todayrow i{font-style:normal;color:var(--muted)}
.camp svg{display:block;width:100%;height:auto}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.1s ease-in-out infinite alternate}
@keyframes flick{to{transform:scale(1.1,.9) rotate(2deg)}}
.twinkle{animation:tw 2.4s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.35}}
.beam{transform-box:view-box;transform-origin:314px 60px;animation:beam 4s ease-in-out infinite alternate}
@keyframes beam{from{transform:rotate(-5deg)}to{transform:rotate(6deg)}}
.bob{animation:bob 3s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(2px)}}
.smoke{animation:smoke 3.5s ease-in-out infinite alternate}
@keyframes smoke{to{transform:translate(3px,-3px);opacity:.45}}
@media (prefers-reduced-motion: reduce){.flame,.twinkle,.beam,.bob,.smoke{animation:none}}
.unl{display:flex;flex-wrap:wrap;gap:6px}
.unl span{font-size:.8rem;font-weight:600;border-radius:999px;padding:4px 11px;background:var(--done-soft);color:var(--done);border:1px solid transparent}
.unl span.lock{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.appbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.appbar .brand{font-family:var(--f-display);font-weight:800;font-size:1.05rem}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;padding:11px 12px;font-size:1rem}
.shop{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.shop li{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.shop li:last-child{border-bottom:none}
.shop .item{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:none;text-align:left;padding:11px 0;font-size:1rem}
.shop .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:.9rem;color:var(--surface)}
.shop li.done .box{background:var(--done);border-color:var(--done)}
.shop li.done .nm{color:var(--muted);text-decoration:line-through}
.shop .nm{min-width:0;overflow-wrap:anywhere}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);font-weight:600}
.fld input,.fld textarea{font-size:1rem;font-weight:400;padding:10px 12px;width:100%;box-sizing:border-box}
.fld textarea{resize:vertical;line-height:1.45}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;box-shadow:var(--shadow);color:var(--fg)}
.tile .te{font-size:1.8rem;line-height:1}.tile .tn{font-weight:700;font-size:1rem;margin-top:6px}.tile .tc{font-size:.8rem;color:var(--muted)}
.stbadge{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.78rem;font-weight:700;white-space:nowrap;color:var(--fg)}
.stbadge.st-geplant{background:#fff3c4;border-color:#e3c35a;color:#5b4a10}.stbadge.st-dran{background:#d8eee2;border-color:#7fbf9b;color:#1f4a35}
.brandbtn{background:none;border:none;padding:6px 8px 6px 0;margin:0;cursor:pointer;color:inherit;-webkit-tap-highlight-color:rgba(0,0,0,.08)}
.tripform{display:flex;flex-direction:column;gap:14px}
.tripform .unl{margin-top:2px}
.tripform .chipbtn{font-size:.85rem;padding:6px 12px}
.tripform .chipbtn[aria-pressed=true],.chipbtn[data-packlist][aria-pressed=true],.chipbtn[data-tfilter][aria-pressed=true],.chipbtn[data-pfilter][aria-pressed=true],.chipbtn[data-playsec][aria-pressed=true],.chipbtn[data-kitasec][aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.danger{color:#b3402a}
.rechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;background:none;border:none;padding:0;text-align:left}
.rechead .nm{font-family:var(--f-display);font-weight:700;font-size:1.05rem;min-width:0;overflow-wrap:anywhere}
.rechead .freq{white-space:nowrap}
.ing{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:3px}
.recnote{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);font-size:.93rem}
.meals{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.meals li{border-bottom:1px solid var(--line)}
.meals li:last-child{border-bottom:none}
.meals li.edit{display:flex;flex-direction:column;gap:10px;padding:12px 0}
.meals li.edit input{font-size:1rem;padding:10px 12px}
.meals li.edit .day{font-weight:700}
.mealrow{display:flex;align-items:baseline;gap:12px;width:100%;background:none;border:none;text-align:left;padding:12px 0;font-size:1rem}
.mealrow .day{flex:none;width:4.6em;font-weight:700}
.meals li.today .mealrow .day{color:var(--accent-ink,var(--done))}
.mealrow .dish{min-width:0;overflow-wrap:anywhere}
.mealrow .dish.none{color:var(--muted);font-size:.9rem}
.tag{font-size:.7rem;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--done-soft);color:var(--done);white-space:nowrap}
.chipbtn[data-mealrec][aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.shopgrp{display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.shopgrp span{font-size:1.05rem}
.shopgrp+.shop{margin-top:-6px}
.shop .catbtn{background:none;border:none;padding:8px 4px;font-size:1.05rem;opacity:.75}
.shop li.catpick{padding:4px 0 12px}
.shop li.catpick .chipbtn{font-size:.82rem;padding:5px 10px}
.shop li.catpick .chipbtn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.starrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.starrow .who{font-weight:600}
.stars{display:flex;gap:2px}
.star{background:none;border:none;padding:4px 5px;font-size:1.45rem;line-height:1;color:var(--line)}
.star.on{color:var(--accent,#f4b860)}

<script>
(function(){
"use strict";
// ---------- Vorlage (nur per Knopf im leeren Zustand) ----------
const TEMPLATE={persons:["Florian","Judith"],rotOffset:0,tasks:[
 {id:"essen",name:"Essen machen, Tisch wischen, Küche in Schuss halten",owner:"ho",freq:"day",pts:3},
 {id:"schlafzimmer",name:"Schlafzimmer aufräumen",owner:"both",freq:"day",pts:1},
 {id:"einkaufen",name:"Einkaufen",owner:"rot",pack:"A",freq:"week",times:3,pts:4},
 {id:"bad",name:"Bad putzen",owner:"rot",pack:"A",freq:"week",times:1,pts:5},

 {id:"plastik",name:"Plastikmüll rausbringen",owner:"rot",pack:"A",freq:"week",times:1,pts:1},

 {id:"bringen-1",name:"Bringen",owner:"p1",freq:"week",times:2,pts:2},
 {id:"mittag",name:"Gemeinsames Mittagessen",owner:"both",freq:"week",times:1,pts:2},
 {id:"eigenes",name:"Eigenes Zeug aufräumen (alles außer Schlafzimmer)",owner:"both",freq:"week",times:3,pts:1},
 {id:"nathan",name:"Nathans Klamotten einräumen",owner:"p1",freq:"week",times:3,pts:1},
 {id:"pflanzen-drinnen",name:"Pflanzen drinnen",owner:"p1",freq:"week",times:1,pts:2},
 {id:"pflanzen-draussen",name:"Pflanzen draußen",owner:"p0",freq:"week",times:2,pts:1},
 {id:"balkon",name:"Balkon",owner:"p0",freq:"week",times:1,pts:2},
 {id:"sz-saugen",name:"Staubsaugen Schlafzimmer",owner:"p0",freq:"week",times:1,pts:2},
 {id:"zimmer-drueben",name:"Zimmer drüben putzen",owner:"rot",freq:"month",pts:6},
 {id:"flaechen-1",name:"Flächen: Kommode und Fensterbank",owner:"p1",freq:"month",pts:2},
 {id:"flaechen-0",name:"Flächen: roter Schrank",owner:"p0",freq:"month",pts:2},
 {id:"buecherregal",name:"Bücherregal Wohnzimmer",owner:"p1",freq:"half",pts:6},
 {id:"grossputz",name:"Großputz (langes Wochenende)",owner:"p0",freq:"half",pts:48},
 {id:"center",name:"Center putzen",owner:"rot",freq:"year",pts:18}
]};
const FREQ_LABEL={day:"täglich",week:"pro Woche",month:"monatlich",half:"halbjährlich",year:"jährlich"};
const OWNER_LABEL={rot:"Im Wechsel",both:"Beide",ho:"Homeoffice"};
const LEVELS=["Chaos-Höhle","Studi-Bude","Ordentliche WG","Gemütliches Nest","Blitzblank-Wohnung","Wohlfühl-Zuhause","Hausmeister-Palast","Glanz-Villa","Putz-Schloss","Legendäres Heim"];
const DAYS=["Mo","Di","Mi","Do","Fr","Sa","So"];
const GOAL=0.8;

// ---------- Datum ----------
const DAY=864e5;
function startOfDay(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function mondayOf(d){const x=startOfDay(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();const w=Math.ceil(((t-Date.UTC(y,0,1))/DAY+1)/7);return {y,w}}
function wkKey(mon){const {y,w}=isoWeek(mon);return y+"-W"+String(w).padStart(2,"0")}
function mondayFromKey(k){const [y,w]=k.split("-W").map(Number);return addDays(mondayOf(new Date(y,0,4)),(w-1)*7)}
const REF=new Date(2024,0,1);
function weekIndex(mon){return Math.round((mon-REF)/(7*DAY))}
function periodOf(freq,mon){const th=addDays(mon,3);const y=th.getFullYear(),m=th.getMonth();
  if(freq==="month")return {id:y+"-"+m,idx:y*12+m};
  if(freq==="half")return {id:y+"-H"+(m<6?1:2),idx:y*2+(m<6?0:1)};
  if(freq==="year")return {id:""+y,idx:y};
  return {id:wkKey(mon),idx:weekIndex(mon)}}
const fmt=(d,o)=>d.toLocaleDateString("de-DE",o);

// ---------- Zustand ----------
const S={key:null,kitaSec:"termine",kitaDraft:null,kitaText:"",playMapOpen:false,playMapEdit:false,playMapText:"",playDraft:null,playSec:"spielplatz",projFilter:"",projText:"",tripTab:"ideen",tripDraft:null,tripFilter:"",packList:"main",packListNew:false,packText:"",ideas:null,shopCatEdit:null,lunchDraft:null,lunchOpen:null,lunchMapOpen:false,lunchMapEdit:false,lunchMapText:"",recDraft:null,recOpen:null,planEdit:null,planText:"",planRec:null,foodWeek:null,food:{},foodTab:"plan",shopText:"",store:null,mode:"loading",config:null,weeks:{},view:mondayOf(new Date()),tab:"camp",campDraft:null,filter:"alle",hideDone:false,groupBy:"freq",me:null,draft:null,timedOut:false};
try{const m=localStorage.getItem("hq-me");if(m==="p0"||m==="p1")S.me=m;const f=localStorage.getItem("hq-filter");if(f==="meine")S.filter="meine";S.hideDone=localStorage.getItem("hq-hidedone")==="1";if(localStorage.getItem("hq-groupby")==="art")S.groupBy="art";const ft=localStorage.getItem("hq-foodtab");if(ft&&ft!=="shop")S.foodTab=ft;}catch(e){}

// ---------- Speicher-Adapter ----------
function dbStore(db){
  const chains={};
  return {
    listen(onCfg,onWeeks,onErr){
      db.doc("config/main").onSnapshot(s=>onCfg(s.exists?s.data():null,s.metadata.fromCache),onErr);
      db.collection("weeks").limit(1000).onSnapshot(q=>{const w={};q.docs.forEach(d=>{w[d.id]=d.data()});onWeeks(w,q.metadata.fromCache)},onErr);
    },
    tick(wk,key,val){const run=async()=>{const ref=db.doc("weeks/"+wk);
        if(!S.weeks[wk]) await ref.set({wk,ticks:{[key]:val}}); else await ref.update({ticks:{[key]:val}});};
      chains[wk]=(chains[wk]||Promise.resolve()).then(run,run);return chains[wk]},
    saveConfig(cfg){return db.doc("config/main").set(cfg)}
  }
}

const SYNC_URL="https://haushalt-32464-default-rtdb.europe-west1.firebasedatabase.app";
function fbStore(base){
  let tree={},cbs=null,opened=false;
  const setAt=(p,data)=>{const parts=p.split("/").filter(Boolean);
    if(!parts.length){tree=(data&&typeof data==="object")?data:{};return}
    let o=tree;for(let i=0;i<parts.length-1;i++){if(typeof o[parts[i]]!=="object"||o[parts[i]]===null)o[parts[i]]={};o=o[parts[i]]}
    const last=parts[parts.length-1];if(data===null||data===undefined)delete o[last];else o[last]=data};
  const emit=()=>{if(!cbs)return;const c=tree.config||null;if(c&&c.tasks&&!Array.isArray(c.tasks))c.tasks=Object.values(c.tasks);
    cbs[0](c?JSON.parse(JSON.stringify(c)):null,!opened);cbs[1](JSON.parse(JSON.stringify(tree.weeks||{})),!opened);if(cbs[3])cbs[3](JSON.parse(JSON.stringify(tree.food||{})))};
  const send=async(method,p,body)=>{const r=await fetch(base+p+".json",{method,body:JSON.stringify(body)});if(!r.ok)throw {code:r.status===401||r.status===403?"invalid_argument":"unavailable"}};
  return {
    listen(a,b,onErr,d){cbs=[a,b,onErr,d];const es=new EventSource(base+".json");
      es.addEventListener("put",e=>{const d=JSON.parse(e.data);opened=true;setAt(d.path,d.data);S.timedOut=false;emit()});
      es.addEventListener("patch",e=>{const d=JSON.parse(e.data);Object.keys(d.data||{}).forEach(k=>setAt(d.path+"/"+k,d.data[k]));emit()});
      es.addEventListener("cancel",()=>onErr({code:"revoked"}));
      es.onerror=()=>{if(opened){S.timedOut=true;render();return}
        fetch(base+"/probe.json").then(r=>{S.dbError=(r.status===401||r.status===403)?"rules":(r.ok?null:"offline")},()=>{S.dbError="offline"}).then(()=>{if(S.dbError==="rules")es.close();render()})};es.onopen=()=>{if(S.timedOut){S.timedOut=false;render()}}},
    async tick(wk,key,val){const prev=(tree.weeks&&tree.weeks[wk]&&tree.weeks[wk].ticks||{})[key];
      setAt("weeks/"+wk+"/ticks/"+key,val);emit();
      try{await send("PATCH","/weeks/"+wk+"/ticks",{[key]:val})}catch(e){setAt("weeks/"+wk+"/ticks/"+key,prev===undefined?null:prev);emit();throw e}},
    saveConfig(cfg){return send("PUT","/config",cfg)},
    async setPath(p,val){let prev=tree;p.split("/").forEach(k=>{prev=prev==null?undefined:prev[k]});prev=prev===undefined?null:JSON.parse(JSON.stringify(prev));
      setAt(p,val);emit();try{await send("PUT","/"+p,val)}catch(e){setAt(p,prev);emit();throw e}}
  }
}
function houseKey(){let k=null;const m=location.hash.match(/k=([A-Za-z0-9_-]{12,64})/);if(m)k=m[1];
  try{if(k)localStorage.setItem("hq-key",k);else k=localStorage.getItem("hq-key")}catch(e){}
  if(k&&!m){try{history.replaceState(null,"","#k="+k)}catch(e){}}return k}
function newKey(){const a=new Uint8Array(18);crypto.getRandomValues(a);return Array.from(a,x=>"abcdefghijkmnopqrstuvwxyz23456789"[x%32]).join("")}
function inviteLink(){return location.href.split("#")[0]+"#k="+S.key}
function renderSetup(){return `<div><div class="eyebrow">Willkommen</div><h1>🏕️🧹</h1></div>
  <section class="card"><h2>Neuen Haushalt starten</h2><div>Du bekommst einen geheimen Link. Wer den Link hat, sieht und bearbeitet denselben Plan. Ein Konto braucht niemand.</div><div><button class="primary" data-act="newhouse">Haushalt starten</button></div></section>
  <section class="card"><h2>Schon eingeladen?</h2><div>Öffne den Link, den du bekommen hast, oder füge ihn hier ein.</div><div class="line" style="display:flex;gap:8px;flex-wrap:wrap"><input type="text" id="joinlink" placeholder="Link einfügen" style="flex:1 1 200px;min-width:0"><button class="ghost" data-act="join">Beitreten</button></div></section>`}
function localStore(){
  const K="hq-local-v1";let data={config:null,weeks:{}};
  try{const raw=localStorage.getItem(K);if(raw)data=JSON.parse(raw)}catch(e){}
  let cbs=null;const save=()=>{try{localStorage.setItem(K,JSON.stringify(data))}catch(e){}};
  const emit=()=>{if(cbs){cbs[0](data.config,false);cbs[1](JSON.parse(JSON.stringify(data.weeks)),false);if(cbs[3])cbs[3](JSON.parse(JSON.stringify(data.food||{})))}};
  return {
    listen(a,b,c,d){cbs=[a,b,c,d];emit()},
    async tick(wk,key,val){data.weeks[wk]=data.weeks[wk]||{wk,ticks:{}};data.weeks[wk].ticks[key]=val;save();emit()},
    async saveConfig(cfg){data.config=cfg;save();emit()},
    async setPath(p,val){const parts=p.split("/");let o=data;for(let i=0;i<parts.length-1;i++){if(typeof o[parts[i]]!=="object"||o[parts[i]]===null)o[parts[i]]={};o=o[parts[i]]}
      if(val===null)delete o[parts[parts.length-1]];else o[parts[parts.length-1]]=val;save();emit()}
  }
}

// ---------- Logik ----------
function tasks(){return (S.config&&S.config.tasks)||[]}
function pname(p){const ps=(S.config&&S.config.persons)||TEMPLATE.persons;return p==="p0"?ps[0]:ps[1]}
function slotsOf(t){return t.freq==="day"?7:t.freq==="week"?Math.max(1,t.times|0||1):1}
function load(t){return (t.pts||0)*slotsOf(t)}
function group(f){return f==="day"||f==="week"?"week":f}
// Rotationsaufgaben je Rhythmus in zwei gleich schwere Pakete A/B teilen
function rotSplit(){const res={};
  ["week","month","half","year"].forEach(g=>{const all=tasks().filter(t=>t.owner==="rot"&&group(t.freq)===g);
    let a=0,b=0;all.forEach(t=>{if(t.pack==="A"){res[t.id]="A";a+=load(t)}else if(t.pack==="B"){res[t.id]="B";b+=load(t)}});
    all.filter(t=>t.pack!=="A"&&t.pack!=="B").sort((x,y)=>load(y)-load(x)).forEach(t=>{if(a<=b){res[t.id]="A";a+=load(t)}else{res[t.id]="B";b+=load(t)}})});
  return res}
// Gerade ISO-KW / gerader Monat / gerades Jahr: Paket A -> Person 1 (Florian), Paket B -> Person 2
function rotParity(freq,mon){const th=addDays(mon,3);
  if(group(freq)==="week")return isoWeek(mon).w%2;
  if(freq==="month")return (th.getMonth()+1)%2;
  if(freq==="half")return th.getMonth()<6?1:0;
  return th.getFullYear()%2}
function ownerFor(t,mon,split){
  if(t.owner!=="rot")return t.owner;
  const flip=(rotParity(t.freq,mon)+((S.config&&S.config.rotOffset)|0))%2;
  const pack=(split||rotSplit())[t.id]||"A";
  return (pack==="A")===(flip===0)?"p0":"p1"}
function ticksOf(wk){return (S.weeks[wk]&&S.weeks[wk].ticks)||{}}
function periodTick(t,mon){const pid=periodOf(t.freq,mon).id;const key=t.id+"__p";
  for(const wk in S.weeks){const v=ticksOf(wk)[key];if(v&&periodOf(t.freq,mondayFromKey(wk)).id===pid)return {wk,v}}
  return null}
function weekScore(wk){const mon=mondayFromKey(wk);const tk=ticksOf(wk);const byId={};tasks().forEach(t=>byId[t.id]=t);
  const pts={p0:0,p1:0};
  for(const k in tk){const v=tk[k];if(!v)continue;const t=byId[k.split("__")[0]];if(!t)continue;if(v.by==="p0"||v.by==="p1")pts[v.by]+=t.pts||0}
  let due=0,done=0;const split=rotSplit();const assigned={p0:0,p1:0};
  tasks().forEach(t=>{if(group(t.freq)!=="week")return;const n=slotsOf(t);due+=n*(t.pts||0);
    for(let i=0;i<n;i++)if(tk[t.id+"__"+i])done+=t.pts||0;
    const o=ownerFor(t,mon,split);if(o==="p0"||o==="p1")assigned[o]+=load(t)});
  return {pts,due,done,pct:due?done/due:0,assigned}}
function allTime(){const tot={p0:0,p1:0};Object.keys(S.weeks).forEach(wk=>{const s=weekScore(wk);tot.p0+=s.pts.p0;tot.p1+=s.pts.p1});return tot}
function levelFor(xp){let n=0;const need=k=>Math.round(120*k*(k+1)/2);while(need(n+1)<=xp&&n<LEVELS.length-1)n++;return {n,cur:xp-need(n),span:need(n+1)-need(n)}}
function streak(){const cur=mondayOf(new Date());let s=0;let m=addDays(cur,-7);
  for(let i=0;i<200;i++){const sc=weekScore(wkKey(m));if(sc.pct>=GOAL){s++;m=addDays(m,-7)}else break}
  if(weekScore(wkKey(cur)).pct>=GOAL)s++;return s}

// ---------- Aktionen ----------
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}
function floatAt(btn,txt){const card=btn.closest(".task");if(!card)return;const f=document.createElement("span");f.className="float";f.textContent=txt;
  const r=btn.getBoundingClientRect(),c=card.getBoundingClientRect();f.style.left=(r.left-c.left+4)+"px";f.style.top=(r.top-c.top-6)+"px";card.appendChild(f);setTimeout(()=>f.remove(),950)}
async function toggle(btn){
  if(!S.me){toast("Wähle oben zuerst, wer du bist.");return}
  const t=tasks().find(x=>x.id===btn.dataset.task);if(!t)return;
  let wk=wkKey(S.view),key,cur;
  if(btn.dataset.slot==="p"){const pt=periodTick(t,S.view);key=t.id+"__p";if(pt){wk=pt.wk;cur=pt.v}}
  else if(btn.dataset.split){const base=t.id+"__"+btn.dataset.slot,tk=ticksOf(wk),leg=tk[base];
    if(leg&&leg.by===S.me&&!tk[base+"_"+S.me]){key=base;cur=leg}else{key=base+"_"+S.me;cur=tk[key]}}
  else{key=t.id+"__"+btn.dataset.slot;cur=ticksOf(wk)[key]}
  const val=cur?null:{by:S.me,at:Date.now()};
  try{await S.store.tick(wk,key,val)}catch(e){toast(e&&e.code==="invalid_argument"?"Speichern wurde abgelehnt. Bitte den Einladungs-Link prüfen.":"Keine Verbindung. Bitte nochmal tippen, sobald du online bist.")}
}

// ---------- Rendering ----------
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function ownerChip(o,isRot){const cls=o==="p0"||o==="p1"?o:o;const lbl=o==="p0"||o==="p1"?pname(o):OWNER_LABEL[o];
  return `<span class="owner ${cls}">${isRot?"↻ ":""}${esc(lbl)}</span>`}
function meChooser(){return `<div class="me"><span>Ich bin</span>
  <button class="chipbtn p0" data-me="p0" aria-pressed="${S.me==="p0"}">${esc(pname("p0"))}</button>
  <button class="chipbtn p1" data-me="p1" aria-pressed="${S.me==="p1"}">${esc(pname("p1"))}</button></div>`}
function ring(p){const r=36,c=2*Math.PI*r;const off=c*(1-Math.min(1,p));
  return `<svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="${r}" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="8"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--lemon)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`}

function scopeSwitch(extra){return `<div class="filters" role="group" aria-label="Ansicht"><button class="chipbtn neutral" data-filter="alle" aria-pressed="${S.filter==="alle"}">Alle</button><button class="chipbtn neutral" data-filter="meine" aria-pressed="${S.filter==="meine"}">Mein Bereich</button>${extra||""}</div>${S.filter==="meine"&&!S.me?`<div class="notice">Wähle oben aus, wer du bist, damit „Mein Bereich“ funktioniert.</div>`:""}`}
function renderWeek(){

const NAV=[];let navBusy=false;
function navKey(){return S.tab+"|"+(S.tab==="essen"?S.foodTab:S.tab==="ausflug"?S.tripTab:S.tab==="spiel"?S.playSec:S.tab==="kita"?S.kitaSec:S.tab==="projekte"||S.tab==="amhaus"?S.projFilter:"")+"|"+((S.recDraft||S.planEdit||S.lunchDraft||S.campDraft||S.lunchMapEdit||S.tripDraft||S.projDraft||S.playDraft||S.kitaDraft)?"d":"")}
function syncNav(){if(!S.config)return;const k=navKey();try{
  if(!NAV.length){NAV.push(k);history.replaceState({i:0,k},"");return}
  if(NAV[NAV.length-1]===k)return;
  if(NAV.length>1&&NAV[NAV.length-2]===k){NAV.pop();navBusy=true;history.back();return}
  NAV.push(k);history.pushState({i:NAV.length-1,k},"")}catch(_){}}

  if(b.dataset.recshop){const r=recs().find(x=>x.id===b.dataset.recshop);if(r)shopAddMany(recIng(r),r.name);return}
  if(b.dataset.shopblockrm){shopRemoveBlock(b.dataset.shopblockrm);return}
  if(b.dataset.ideashop){const x=((S.ideas&&S.ideas.items)||[])[+b.dataset.ideashop];if(x&&Array.isArray(x.ing))shopAddMany(x.ing.map(String),x.name);return}
  if(b.dataset.recedit){const r=recs().find(x=>x.id===b.dataset.recedit);if(r){S.recDraft={id:r.id,name:r.name||"",ing:r.ing||"",note:r.note||"",link:r.link||"",at:r.at||Date.now()};render();window.scrollTo(0,0)}return}

    const id=d.id||("r"+Date.now().toString(36)+Math.random().toString(36).slice(2,5));
    const v={name,ing:recIng(d).map(x=>x.slice(0,80)).slice(0,60).join("\n"),note:(d.note||"").trim().slice(0,4000),link:(d.link||"").trim().slice(0,500),at:d.at||Date.now()};
    try{await S.store.setPath("food/rec/"+id,v);S.recDraft=null;S.recOpen=id;toast("Rezept gespeichert");render()}catch(_){toast("Konnte nicht speichern. Bitte Verbindung prüfen.")}return}
  if(b.dataset.act==="recdel"){const d=S.recDraft;if(!d||!d.id)return;if(!d.sure){d.sure=true;b.textContent="Wirklich löschen?";return}

  if(b.dataset.fnav){const n=+b.dataset.fnav;S.foodWeek=n===0?null:addDays(planWeek(),7*n);S.planEdit=null;render();return}

app.addEventListener("change",e=>{const row=e.target.closest(".editrow[data-i]");if(!row||!S.draft)return;const t=S.draft.tasks[+row.dataset.i];const f=e.target.dataset.f;if(!f)return;

app.addEventListener("submit",e=>{if(e.target.id==="kitaform"){e.preventDefault();const v=S.kitaText;S.kitaText="";const el=document.getElementById("kitainput");if(el)el.value="";kitaAdd(v);return}
  if(e.target.id==="projform"){e.preventDefault();const v=(S.projText||"").trim().slice(0,80);S.projText="";const el=document.getElementById("projinput");if(el)el.value="";if(!v)return;const cat=S.projFilter||projGroup().quick||"";S.store.setPath("food/idea/"+newId("p"),Object.assign({name:v,done:false,at:Date.now(),by:S.me||""},cat?{cat}:{})).catch(()=>toast("Konnte nicht speichern. Bitte Verbindung prüfen."));return}
  if(e.target.id==="packlistform"){e.preventDefault();const el=document.getElementById("packlistinput"),n=(el&&el.value||"").trim().slice(0,40);if(!n)return;const id=newId("l");S.packList=id;S.packListNew=false;S.store.setPath("food/packlist/"+id,{name:n,at:Date.now()}).catch(()=>toast("Konnte nicht speichern."));render();return}
  if(e.target.id==="packform"){e.preventDefault();const v=S.packText;S.packText="";const el=document.getElementById("packinput");if(el)el.value="";packAdd(v);return}
  if(e.target.id!=="shopform")return;e.preventDefault();const v=S.shopText;S.shopText="";const el=document.getElementById("shopinput");if(el)el.value="";shopAdd(v)});

  if(S.playDraft&&e.target.dataset.plf){S.playDraft[e.target.dataset.plf]=e.target.value;
    if(e.target.dataset.plf==="link"&&!S.playDraft.name.trim()){const n=nameFromLink(e.target.value.trim());if(n){S.playDraft.name=n;const el=document.getElementById("pl-name");if(el)el.value=n}}return}
  if(S.projDraft&&e.target.dataset.pf){S.projDraft[e.target.dataset.pf]=e.target.value;return}
  if(S.tripDraft&&e.target.dataset.tf){S.tripDraft[e.target.dataset.tf]=e.target.value;return}
  if(e.target.id==="mealinput"){S.planText=e.target.value;return}

  if(S.lunchDraft&&e.target.dataset.lf){S.lunchDraft[e.target.dataset.lf]=e.target.value;return}

  const row=e.target.closest(".editrow[data-i]");if(!row||!S.draft)return;if(e.target.dataset.f==="name")S.draft.tasks[+row.dataset.i].name=e.target.value});

// ---------- Start ----------
function start(store,mode){S.store=store;S.mode=mode;let gotCfg=false,gotWeeks=false;
  const timer=setTimeout(()=>{S.timedOut=true;if(!gotCfg)S.config=S.config||null;render()},10000);
  store.listen((cfg,fromCache)=>{S.config=cfg;if(!fromCache){gotCfg=true;S.cfgConfirmed=true}if(gotCfg&&gotWeeks){clearTimeout(timer);S.timedOut=false}render()},
    (w,fromCache)=>{S.weeks=w;if(!fromCache)gotWeeks=true;if(gotCfg&&gotWeeks){clearTimeout(timer);S.timedOut=false}render()},
    err=>{clearTimeout(timer);toast("Verbindung zu den gemeinsamen Daten verloren. Seite neu öffnen.")},
    food=>{S.food=food||{};if(S.tab==="essen"||S.tab==="einkauf"||S.tab==="camp"||S.tab==="ausflug"||S.tab==="projekte"||S.tab==="amhaus"||S.tab==="spiel"||S.tab==="kita")render()});
  try{fetch("ideen.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{if(j&&Array.isArray(j.items)){S.ideas=j;if(S.tab==="essen")render()}}).catch(()=>{})}catch(_){}
}
function enter(k){S.key=k;try{localStorage.setItem("hq-key",k);history.replaceState(null,"","#k="+k)}catch(e){}
  start(fbStore(SYNC_URL+"/haushalt/"+k),"web");render()}
if(!SYNC_URL)start(localStore(),"local");else{const k=houseKey();if(k)enter(k);else{S.mode="setup";render()}}
window.addEventListener("hashchange",()=>{const m=location.hash.match(/k=([A-Za-z0-9_-]{12,64})/);if(m&&m[1]!==S.key)location.reload()});
})();
