<title>🏕️🧹</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: eine schmale App-Spalte, oben Wochen-Scoreboard, darunter Aufgabenkarten mit tippbaren Häkchen-Slots; Tabs unten fixiert */
:root{padding-top:env(safe-area-inset-top,0px);
  --bg:#f1f4f1; --surface:#ffffff; --surface-2:#e5ebe6; --fg:#1b2622; --muted:#5f6d67; --line:#d5ddd7;
  --ink:#1f4a40; --lemon:#f4b860; --lemon-ink:#4a3000;
  --p0:#1c8577; --p0-soft:#d3eee9; --p1:#c96a1e; --p1-soft:#fbe5d0;
  --both:#5f6396; --both-soft:#e3e4f3; --ho:#667616; --ho-soft:#e9eecb;
  --done:#2f7d5b; --done-soft:#d9efe4; --board-a:#1f4a40; --board-b:#2f6b5c;
  --shadow:0 1px 2px rgba(20,45,38,.06),0 4px 14px rgba(20,45,38,.05);
  --f-display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1513; --surface:#17201d; --surface-2:#1f2b27; --fg:#e6efeb; --muted:#94a59f; --line:#2b3934;
  --ink:#7fd1bd; --lemon:#f4b860; --lemon-ink:#2a1a00;
  --p0:#4fc4b3; --p0-soft:#143630; --p1:#f0a05a; --p1-soft:#40280f;
  --both:#a9adde; --both-soft:#272a48; --ho:#c2d166; --ho-soft:#2c3311;
  --done:#58c493; --done-soft:#173528; --board-a:#1f4a40; --board-b:#2f6b5c;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1513; --surface:#17201d; --surface-2:#1f2b27; --fg:#e6efeb; --muted:#94a59f; --line:#2b3934;
  --ink:#7fd1bd; --lemon:#f4b860; --lemon-ink:#2a1a00;
  --p0:#4fc4b3; --p0-soft:#143630; --p1:#f0a05a; --p1-soft:#40280f;
  --both:#a9adde; --both-soft:#272a48; --ho:#c2d166; --ho-soft:#2c3311;
  --done:#58c493; --done-soft:#173528; --board-a:#1f4a40; --board-b:#2f6b5c;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.app{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 110px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.6rem;font-weight:800}
h2{font-size:1.1rem;font-weight:800}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.weeknav{display:flex;align-items:center;gap:6px}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:1.1rem}
.iconbtn:disabled{opacity:.35;cursor:default}
.me{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.me span{font-size:.85rem;color:var(--muted)}
.chipbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.9rem}
.chipbtn[aria-pressed="true"].p0{background:var(--p0);border-color:var(--p0);color:var(--surface)}
.chipbtn[aria-pressed="true"].p1{background:var(--p1);border-color:var(--p1);color:var(--surface)}
.chipbtn[aria-pressed="true"].neutral{background:var(--fg);border-color:var(--fg);color:var(--bg)}
/* Scoreboard */
.board{background:linear-gradient(135deg,var(--board-a),var(--board-b));color:#fff;box-shadow:var(--shadow);border-radius:20px;padding:16px;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;position:relative;overflow:hidden}
.board .who{display:flex;flex-direction:column;gap:2px;min-width:0}
.board .who.right{text-align:right;align-items:flex-end}
.board button.who{background:none;border:none;color:inherit;font:inherit;text-align:left;padding:0;align-items:flex-start}
.board button.who.right{text-align:right;align-items:flex-end}
.board .name{font-weight:700;font-size:.9rem;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .pts{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1}.board .pts small{font-size:1rem;opacity:.75;font-weight:600}
.board .sub{font-size:.75rem;opacity:.75}
.ring{width:84px;height:84px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-weight:800;font-family:var(--f-display);font-size:1.05rem;line-height:1}
.ring .lbl small{display:block;font-family:var(--f-body);font-weight:600;font-size:.62rem;opacity:.8;margin-top:2px}
.balance{grid-column:1/-1;display:flex;flex-direction:column;gap:5px}
.balbar{height:8px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden;display:flex}
.balbar i{display:block;height:100%}
.balrow{display:flex;justify-content:space-between;font-size:.75rem;opacity:.85;gap:8px}
.streak{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:.82rem;font-weight:600;background:var(--surface);border:1px solid var(--line)}
.pill.lemon{background:var(--lemon);color:var(--lemon-ink);border-color:transparent}
.filters{display:flex;gap:6px;flex-wrap:wrap}
/* Sections and tasks */
.section{display:flex;flex-direction:column;gap:8px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.task{box-shadow:var(--shadow);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 14px;display:flex;flex-direction:column;gap:9px;position:relative}
.task.done{background:var(--surface-2);box-shadow:none}
.task-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.task-title{font-weight:600;min-width:0}
.task.done .task-title{color:var(--muted);text-decoration:line-through}
.donesep{display:flex;align-items:center;gap:10px;font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted);margin-top:4px}
.donesep::before,.donesep::after{content:"";flex:1;height:1px;background:var(--line)}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px}
.owner{font-size:.74rem;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap}
.owner.p0{background:var(--p0-soft);color:var(--p0)}
.owner.p1{background:var(--p1-soft);color:var(--p1)}
.owner.both{background:var(--both-soft);color:var(--both)}
.owner.ho{background:var(--ho-soft);color:var(--ho)}
.freq{font-size:.74rem;color:var(--muted)}
.xp{font-weight:800;font-size:.8rem;color:var(--lemon-ink);background:var(--lemon);border-radius:6px;padding:2px 7px;white-space:nowrap;flex:none}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slot{width:38px;height:38px;border-radius:50%;border:2px dashed var(--line);background:transparent;display:grid;place-items:center;font-size:.7rem;font-weight:700;color:var(--muted);position:relative;transition:transform .15s}
.slot:active{transform:scale(.9)}
.slot.today{border-style:solid;border-color:var(--ink);color:var(--ink)}
.slot.future{opacity:.35}
.slot.on{border-style:solid;color:#fff;font-size:.8rem}
.slot.on.p0{background:var(--p0);border-color:var(--p0)}
.slot.on.p1{background:var(--p1);border-color:var(--p1)}
.slot.split{border-style:solid;color:var(--fg);background:linear-gradient(90deg,var(--L,transparent) 50%,var(--R,transparent) 50%)}
.slot.split.h0{--L:var(--p0)}
.slot.split.h1{--R:var(--p1)}
.slot.split.h0.h1{color:var(--surface);border-color:transparent;font-size:1.05rem}
.slot.on.chk{background:var(--done);border-color:var(--done);font-size:1.05rem}
:root[data-theme="dark"] .slot.on{color:#0d1514}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .slot.on{color:#0d1514}}
.bigcheck{display:flex;align-items:center;gap:10px;border:2px dashed var(--line);border-radius:12px;padding:8px 12px;background:transparent;font-weight:600;text-align:left;color:var(--muted)}
.bigcheck.on{border-style:solid;color:var(--fg)}
.bigcheck.on.p0{border-color:var(--p0);background:var(--p0-soft)}
.bigcheck.on.p1{border-color:var(--p1);background:var(--p1-soft)}
.bigcheck.on.chk{border-color:var(--done);background:var(--done-soft)}
.float{position:absolute;pointer-events:none;font-weight:800;font-family:var(--f-display);color:var(--lemon-ink);background:var(--lemon);border-radius:8px;padding:1px 6px;font-size:.85rem;animation:up .9s ease-out forwards;z-index:3}
@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-34px)}}
@media (prefers-reduced-motion: reduce){.float{animation:none;opacity:0}.slot{transition:none}}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.notice{font-size:.85rem;background:var(--surface-2);border-radius:10px;padding:10px 12px;color:var(--muted)}
.primary{background:var(--ink);color:var(--bg);border:none;border-radius:10px;padding:10px 16px;font-weight:700}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:600}
.danger{color:var(--p1)}
/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
.tabs button{flex:1;max-width:160px;background:none;border:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;font-weight:600;color:var(--muted)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-selected="true"]{color:var(--ink)}
/* Score tab */
.card{box-shadow:var(--shadow);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.level{display:flex;gap:14px;align-items:center}
.badge{width:64px;height:64px;border-radius:18px;background:var(--lemon);color:var(--lemon-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.8rem;flex:none}
.xpbar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--lemon)}
.chart{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;align-items:end;height:150px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:2px;min-width:0}
.bar i{display:block;border-radius:4px}
.bar .b0{background:var(--p0)}.bar .b1{background:var(--p1)}
.bar.ok::after{content:"";}
.chart-x{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;font-size:.7rem;color:var(--muted);text-align:center}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface-2);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem}
.alist{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column}
.alist li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-bottom:1px solid var(--line);padding:7px 0}
.alist li:last-child{border-bottom:none}
.alist li span:first-child{min-width:0}
.alist .freq{white-space:nowrap}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px}
.dot.p0{background:var(--p0)}.dot.p1{background:var(--p1)}.dot.both{background:var(--both)}.dot.ho{background:var(--ho)}
.camp{border-radius:20px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
.camp svg{display:block;width:100%;height:auto}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.1s ease-in-out infinite alternate}
@keyframes flick{to{transform:scale(1.1,.9) rotate(2deg)}}
.twinkle{animation:tw 2.4s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.35}}
@media (prefers-reduced-motion: reduce){.flame,.twinkle{animation:none}}
.unl{display:flex;flex-wrap:wrap;gap:6px}
.unl span{font-size:.8rem;font-weight:600;border-radius:999px;padding:4px 11px;background:var(--done-soft);color:var(--done);border:1px solid transparent}
.unl span.lock{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.appbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.appbar .brand{font-family:var(--f-display);font-weight:800;font-size:1.05rem}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;padding:11px 12px;font-size:1rem}
.shop{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.shop li{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.shop li:last-child{border-bottom:none}
.shop .item{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:none;text-align:left;padding:11px 0;font-size:1rem}
.shop .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:.9rem;color:var(--surface)}
.shop li.done .box{background:var(--done);border-color:var(--done)}
.shop li.done .nm{color:var(--muted);text-decoration:line-through}
.shop .nm{min-width:0;overflow-wrap:anywhere}
.shop .rm{background:none;border:none;color:var(--muted);padding:8px;font-size:1rem}
/* Plan tab */
.rotlist{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rotlist > div{border-radius:12px;padding:10px 12px;min-width:0}
.rotlist .r0{background:var(--p0-soft)}.rotlist .r1{background:var(--p1-soft)}
.rotlist ul{margin:6px 0 0;padding-left:18px;font-size:.88rem}
.editrow{display:grid;grid-template-columns:1fr;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.editrow .line{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.editrow input[type=text]{flex:1 1 200px;min-width:0}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
input[type=number]{width:64px}
label.sm{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:4px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.88rem;font-weight:600;z-index:9;max-width:calc(100% - 32px)}
.celebrate{background:var(--lemon);color:var(--lemon-ink);border-radius:var(--r);padding:12px 14px;font-weight:700;display:flex;gap:10px;align-items:center}
</style>

<div class="app" id="app">
  <div class="empty" id="boot">🏕️🧹 wird geladen …</div>
</div>

const DAY=864e5;
function startOfDay(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}

function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();const w=Math.ceil(((t-Date.UTC(y,0,1))/DAY+1)/7);return {y,w}}
function wkKey(mon){const {y,w}=isoWeek(mon);return y+"-W"+String(w).padStart(2,"0")}
function mondayFromKey(k){const [y,w]=k.split("-W").map(Number);return addDays(mondayOf(new Date(y,0,4)),(w-1)*7)}
const REF=new Date(2024,0,1);
function weekIndex(mon){return Math.round((mon-REF)/(7*DAY))}
function periodOf(freq,mon){const th=addDays(mon,3);const y=th.getFullYear(),m=th.getMonth();
  if(freq==="month")return {id:y+"-"+m,idx:y*12+m};
  if(freq==="half")return {id:y+"-H"+(m<6?1:2),idx:y*2+(m<6?0:1)};
  if(freq==="year")return {id:""+y,idx:y};
  return {id:wkKey(mon),idx:weekIndex(mon)}}

// ---------- Logik ----------
function tasks(){return (S.config&&S.config.tasks)||[]}
function pname(p){const ps=(S.config&&S.config.persons)||TEMPLATE.persons;return p==="p0"?ps[0]:ps[1]}
function slotsOf(t){return t.freq==="day"?7:t.freq==="week"?Math.max(1,t.times|0||1):1}
function load(t){return (t.pts||0)*slotsOf(t)}
function group(f){return f==="day"||f==="week"?"week":f}
// Rotationsaufgaben je Rhythmus in zwei gleich schwere Pakete A/B teilen
function rotSplit(){const res={};
  ["week","month","half","year"].forEach(g=>{const all=tasks().filter(t=>t.owner==="rot"&&group(t.freq)===g);
    let a=0,b=0;all.forEach(t=>{if(t.pack==="A"){res[t.id]="A";a+=load(t)}else if(t.pack==="B"){res[t.id]="B";b+=load(t)}});
    all.filter(t=>t.pack!=="A"&&t.pack!=="B").sort((x,y)=>load(y)-load(x)).forEach(t=>{if(a<=b){res[t.id]="A";a+=load(t)}else{res[t.id]="B";b+=load(t)}})});
  return res}
// Gerade ISO-KW / gerader Monat / gerades Jahr: Paket A -> Person 1 (Florian), Paket B -> Person 2
function rotParity(freq,mon){const th=addDays(mon,3);
  if(group(freq)==="week")return isoWeek(mon).w%2;
  if(freq==="month")return (th.getMonth()+1)%2;
  if(freq==="half")return th.getMonth()<6?1:0;
  return th.getFullYear()%2}
function ownerFor(t,mon,split){
  if(t.owner!=="rot")return t.owner;
  const flip=(rotParity(t.freq,mon)+((S.config&&S.config.rotOffset)|0))%2;
  const pack=(split||rotSplit())[t.id]||"A";
  return (pack==="A")===(flip===0)?"p0":"p1"}
function ticksOf(wk){return (S.weeks[wk]&&S.weeks[wk].ticks)||{}}
function periodTick(t,mon){const pid=periodOf(t.freq,mon).id;const key=t.id+"__p";
  for(const wk in S.weeks){const v=ticksOf(wk)[key];if(v&&periodOf(t.freq,mondayFromKey(wk)).id===pid)return {wk,v}}
  return null}
function weekScore(wk){const mon=mondayFromKey(wk);const tk=ticksOf(wk);const byId={};tasks().forEach(t=>byId[t.id]=t);
  const pts={p0:0,p1:0};
  for(const k in tk){const v=tk[k];if(!v)continue;const t=byId[k.split("__")[0]];if(!t)continue;if(v.by==="p0"||v.by==="p1")pts[v.by]+=t.pts||0}
  let due=0,done=0;const split=rotSplit();const assigned={p0:0,p1:0};
  tasks().forEach(t=>{if(group(t.freq)!=="week")return;const n=slotsOf(t);due+=n*(t.pts||0);
    for(let i=0;i<n;i++)if(tk[t.id+"__"+i])done+=t.pts||0;
    const o=ownerFor(t,mon,split);if(o==="p0"||o==="p1")assigned[o]+=load(t)});
  return {pts,due,done,pct:due?done/due:0,assigned}}
function allTime(){const tot={p0:0,p1:0};Object.keys(S.weeks).forEach(wk=>{const s=weekScore(wk);tot.p0+=s.pts.p0;tot.p1+=s.pts.p1});return tot}
function levelFor(xp){let n=0;const need=k=>Math.round(120*k*(k+1)/2);while(need(n+1)<=xp&&n<LEVELS.length-1)n++;return {n,cur:xp-need(n),span:need(n+1)-need(n)}}
function streak(){const cur=mondayOf(new Date());let s=0;let m=addDays(cur,-7);
  for(let i=0;i<200;i++){const sc=weekScore(wkKey(m));if(sc.pct>=GOAL){s++;m=addDays(m,-7)}else break}
  if(weekScore(wkKey(cur)).pct>=GOAL)s++;return s}

  h+=open.length?`<section class="card"><div class="section-head"><h2>Noch zu kaufen</h2><span class="freq num">${open.length}</span></div><ul class="shop">${open.map(li).join("")}</ul></section>`
    :`<div class="empty"><h2>${items.length?"Alles eingekauft":"Die Liste ist leer"}</h2><div>Schreib oben auf, was fehlt. Ihr seht beide dieselbe Liste und hakt im Laden ab.</div></div>`;
  if(done.length)h+=`<section class="card"><div class="section-head"><h2>Im Wagen</h2><button class="ghost" data-act="shopclear">Erledigte entfernen</button></div><ul class="shop">${done.map(li).join("")}</ul></section>`;
  return h}
function renderPlan(){
  const d=S.draft||(S.draft=JSON.parse(JSON.stringify(S.config)));
  const mon=mondayOf(new Date()),split=rotSplit();
  const rot={p0:[],p1:[]};tasks().filter(t=>t.owner==="rot").forEach(t=>rot[ownerFor(t,mon,split)].push(t));
  const li=a=>a.map(t=>`<li>${esc(t.name)} <span class="freq">(${t.freq==="week"?(t.times||1)+"×/Woche":FREQ_LABEL[t.freq]})</span></li>`).join("")||"<li>nichts</li>";
  let h=`<div><div class="eyebrow">Fairer Plan</div><h1>Wer macht was</h1></div>
   <section class="card"><h2>Wechsel-Aufgaben, aktuell</h2>
   <div class="freq">Wöchentliche Wechsel-Aufgaben sind in Paket A und Paket B geteilt. In geraden Kalenderwochen hat ${esc(pname("p0"))} Paket A, in ungeraden ${esc(pname("p1"))}. Monatliche Wechsel-Aufgaben: gerader Monat ${esc(pname("p0"))}, ungerader ${esc(pname("p1"))}. Jährliche: gerades Jahr ${esc(pname("p0"))}, ungerades ${esc(pname("p1"))}.</div>
   <div class="rotlist"><div class="r0"><b>${esc(pname("p0"))}</b><ul>${li(rot.p0)}</ul></div><div class="r1"><b>${esc(pname("p1"))}</b><ul>${li(rot.p1)}</ul></div></div>
   <div><button class="ghost" data-act="swap">Pakete tauschen</button></div>
   <div class="notice">Grundregel: Ihr könnt immer gemeinsam abweichen und den Plan anpassen.</div></section>`;
  if(S.mode==="web")h+=`<section class="card"><h2>Einladungs-Link</h2><div class="freq">Schick diesen Link an ${esc(pname("p1"))}. Wer ihn öffnet, sieht denselben Plan. Tipp: im Browser „Zum Home-Bildschirm“ wählen, dann startet die App wie eine normale App.</div><input type="text" id="invite" readonly value="${esc(inviteLink())}"><div><button class="ghost" data-act="copy">Link kopieren</button></div></section>`;
  h+=`<section class="section"><div class="section-head"><h2>Aufgaben bearbeiten</h2></div>
   <div class="editrow"><div class="line"><label class="sm">Person 1 <input type="text" id="pn0" value="${esc(d.persons[0])}"></label><label class="sm">Person 2 <input type="text" id="pn1" value="${esc(d.persons[1])}"></label></div></div>`;
  d.tasks.forEach((t,i)=>{
    const ownOpts=[["p0",d.persons[0]],["p1",d.persons[1]],["rot","Im Wechsel"],["both","Beide"],["ho","Homeoffice"]].map(([v,l])=>`<option value="${v}" ${t.owner===v?"selected":""}>${esc(l)}</option>`).join("");
    const fOpts=Object.keys(FREQ_LABEL).map(v=>`<option value="${v}" ${t.freq===v?"selected":""}>${v==="week"?"x-mal pro Woche":FREQ_LABEL[v]}</option>`).join("");
    h+=`<div class="editrow" data-i="${i}"><div class="line"><input type="text" id="tn-${esc(t.id)}" data-f="name" value="${esc(t.name)}" aria-label="Aufgabe"><button class="ghost danger" data-del="${i}" aria-label="Löschen">✕</button></div>
      <div class="line"><select id="to-${esc(t.id)}" data-f="owner" aria-label="Wer">${ownOpts}</select><select id="tf-${esc(t.id)}" data-f="freq" aria-label="Rhythmus">${fOpts}</select>
      ${t.freq==="week"?`<label class="sm"><input type="number" min="1" max="14" id="tt-${esc(t.id)}" data-f="times" value="${t.times||1}">× </label>`:""}
      ${t.owner==="rot"&&t.freq!=="month"&&t.freq!=="year"?`<select id="tk-${esc(t.id)}" data-f="pack" aria-label="Paket"><option value="" ${!t.pack?"selected":""}>Paket automatisch</option><option value="A" ${t.pack==="A"?"selected":""}>Paket A</option><option value="B" ${t.pack==="B"?"selected":""}>Paket B</option></select>`:""}
      ${t.owner==="rot"&&group(t.freq)==="week"?`<label class="sm"><input type="number" min="0" max="50" id="tp-${esc(t.id)}" data-f="pts" value="${t.pts||0}"> Aufwand</label>`:""}</div></div>`});
  h+=`<div class="line" style="display:flex;gap:8px;flex-wrap:wrap"><button class="ghost" data-act="add">+ Aufgabe</button><button class="primary" data-act="save">Plan speichern</button><button class="ghost" data-act="reset">Änderungen verwerfen</button></div></section>`;
  return h}

function render(){
  if(S.mode==="loading")return;
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab));
  let h="";
  if(S.mode==="setup"){app.innerHTML=renderSetup();return}
  if(S.mode==="web"&&S.dbError==="rules"&&!S.cfgConfirmed){app.innerHTML=`<section class="card"><h2>Die Datenbank lehnt den Zugriff ab</h2><div>In Firebase sind die Regeln noch nicht veröffentlicht. Öffne dort „Realtime Database“, Reiter „Regeln“, ersetze den gesamten Text durch die folgende Zeile und tippe auf „Veröffentlichen“.</div><input type="text" readonly id="rulesline" value='{"rules":{"haushalt":{"$key":{".read":true,".write":true}}}}'><div><button class="primary" data-act="reload">Erneut versuchen</button></div></section>`;return}
  if(S.mode==="web"&&S.dbError==="offline"&&!S.cfgConfirmed){app.innerHTML=`<section class="card"><h2>Keine Verbindung zur Datenbank</h2><div>Entweder fehlt gerade das Internet, oder die Regeln in Firebase sind noch nicht veröffentlicht. Für den zweiten Fall: Öffne in Firebase „Realtime Database“, Reiter „Regeln“, ersetze den gesamten Text durch die folgende Zeile und tippe auf „Veröffentlichen“.</div><input type="text" readonly id="rulesline" value='{"rules":{"haushalt":{"$key":{".read":true,".write":true}}}}'><div><button class="primary" data-act="reload">Erneut versuchen</button></div></section>`;return}
  if(S.mode==="local")h+=`<div class="notice">Der Abgleich ist noch nicht eingerichtet. Die Daten bleiben vorerst nur auf diesem Gerät.</div>`;
  if(S.timedOut&&S.mode==="web")h+=`<div class="notice">Die gemeinsamen Daten sind gerade nicht erreichbar. Angezeigtes kann veraltet sein.</div>`;
  if(!S.config&&!S.cfgConfirmed&&!S.timedOut){app.innerHTML=h+`<div class="empty">Plan wird geladen …</div>`;return}
  if(!S.config){h+=`<div class="empty"><h2>Noch kein Haushaltsplan hinterlegt</h2><div>Legt euren Plan aus der Vorlage an (eure Liste mit Müll, Saugen, Wäsche und Co.). Danach könnt ihr alles unter „Plan“ anpassen.</div><button class="primary" data-act="template">Plan aus Vorlage anlegen</button></div>`;app.innerHTML=h;return}
  h+=S.tab==="plan"?`<div class="appbar"><button class="ghost" data-go="woche">‹ Zurück</button><span class="brand">Einstellungen</span></div>`
    :`<div class="appbar"><span class="brand">🏕️🧹</span><button class="iconbtn" data-go="plan" aria-label="Plan und Einstellungen"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button></div>`;
  h+=S.tab==="woche"?renderWeek():S.tab==="alle"?renderAll():S.tab==="camp"?renderCamp():S.tab==="essen"?renderFood():renderPlan();
  const y=window.scrollY,ae=document.activeElement,fid=ae&&app.contains(ae)&&ae.id?ae.id:null,sel=fid&&ae.selectionStart!=null?[ae.selectionStart,ae.selectionEnd]:null;
  app.innerHTML=h;window.scrollTo(0,y);
  if(fid){const el=document.getElementById(fid);if(el){el.focus({preventScroll:true});if(sel){try{el.setSelectionRange(sel[0],sel[1])}catch(_){}}}}
}

// ---------- Events ----------
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(!b)return;S.tab=b.dataset.tab;if(S.tab!=="plan")S.draft=null;if(S.tab!=="camp")S.campDraft=null;render();window.scrollTo(0,0)});
app.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.go){S.tab=b.dataset.go;S.draft=null;S.campDraft=null;render();window.scrollTo(0,0);return}
  if(b.dataset.food){S.foodTab=b.dataset.food;try{localStorage.setItem("hq-foodtab",S.foodTab)}catch(_){}render();return}
  if(b.dataset.shop){const i=shopItems().find(x=>x.id===b.dataset.shop);if(i){const v={name:i.name,done:!i.done,at:i.at||Date.now(),by:i.by||""};if(v.done)v.doneAt=Date.now();try{await S.store.setPath("food/shop/"+i.id,v)}catch(_){toast("Konnte nicht speichern. Bitte Verbindung prüfen.")}}return}
  if(b.dataset.shoprm){try{await S.store.setPath("food/shop/"+b.dataset.shoprm,null)}catch(_){toast("Konnte nicht speichern.")}return}
  if(b.dataset.shopfav){shopAdd(b.dataset.shopfav);return}
  if(b.dataset.act==="shopclear"){for(const i of shopItems().filter(x=>x.done)){try{await S.store.setPath("food/shop/"+i.id,null)}catch(_){}}return}
  if(b.dataset.me){S.me=b.dataset.me;try{localStorage.setItem("hq-me",S.me)}catch(_){}render();return}
  if(b.dataset.act==="groupby"||b.dataset.jump){const j=b.dataset.jump;S.groupBy=j?"art":(S.groupBy==="art"?"freq":"art");try{localStorage.setItem("hq-groupby",S.groupBy)}catch(_){}render();
    if(j){const el=document.getElementById("sec-"+j);if(el)el.scrollIntoView({behavior:"smooth",block:"start"})}return}
  if(b.dataset.act==="hidedone"){S.hideDone=!S.hideDone;try{localStorage.setItem("hq-hidedone",S.hideDone?"1":"0")}catch(_){}render();return}
  if(b.dataset.filter){S.filter=b.dataset.filter;try{localStorage.setItem("hq-filter",S.filter)}catch(_){}render();return}
  if(b.dataset.nav){const n=+b.dataset.nav;S.view=n===0?mondayOf(new Date()):addDays(S.view,7*n);render();return}
  if(b.dataset.task){toggle(b);return}
  if(b.dataset.del){S.draft.tasks.splice(+b.dataset.del,1);render();return}
  const act=b.dataset.act;
  if(act==="reload"){location.reload();return}
  if(act==="newhouse"){enter(newKey());return}
  if(act==="join"){const m=(document.getElementById("joinlink").value||"").match(/k=([A-Za-z0-9_-]{12,64})/);if(m)enter(m[1]);else toast("Das ist kein gültiger Einladungs-Link.");return}
  if(act==="copy"){const el=document.getElementById("invite");try{await navigator.clipboard.writeText(el.value);toast("Link kopiert")}catch(_){el.focus();el.select();toast("Link markiert, jetzt kopieren")}return}
  if(act==="template"){try{await S.store.saveConfig(JSON.parse(JSON.stringify(TEMPLATE)));toast("Plan angelegt")}catch(_){toast("Konnte den Plan nicht speichern.")}}
  if(act==="add"){S.draft.tasks.push({id:"t"+Date.now().toString(36),name:"Neue Aufgabe",owner:"rot",freq:"week",times:1,pts:2});render()}
  if(act==="campedit"){const cc=campCfg(),costs={};campItems(cc).forEach(c=>{if(!c.emoji)costs[c.id]=c.cost});S.campDraft={costs,extras:JSON.parse(JSON.stringify(cc.extras))};render();return}
  if(act==="campcancel"){S.campDraft=null;render();return}
  if(act==="campadd"){const dr=S.campDraft;const mx=Math.max(campTotal(),...dr.extras.map(e=>e.cost|0));dr.extras.push({id:"x"+Date.now().toString(36),emoji:b.dataset.emoji,name:"",cost:mx+10});render();return}
  if(act==="campdel"){S.campDraft.extras.splice(+b.dataset.i,1);render();return}
  if(act==="campsave"){const dr=S.campDraft,c=JSON.parse(JSON.stringify(S.config));const costs={};CAMP.forEach(x=>{costs[x[0]]=Math.max(0,Math.min(9999,dr.costs[x[0]]|0))});
    c.camp={costs,extras:dr.extras.filter(e=>(e.emoji||"").trim()).map(e=>({id:e.id,emoji:e.emoji.trim().slice(0,8),name:(e.name||"").trim().slice(0,30),cost:Math.max(0,Math.min(9999,e.cost|0))}))};
    try{await S.store.saveConfig(c);S.campDraft=null;render();toast("Zeltplatz gespeichert")}catch(_){toast("Speichern nicht möglich. Bitte Verbindung prüfen.")}return}
  if(act==="toweek"){S.tab="woche";S.view=mondayOf(new Date());render();window.scrollTo(0,0);return}
  if(act==="reset"){S.draft=null;render()}
  if(act==="swap"){const c=JSON.parse(JSON.stringify(S.config));c.rotOffset=((c.rotOffset|0)+1)%2;try{await S.store.saveConfig(c);S.draft=null;toast("Pakete getauscht")}catch(_){toast("Konnte nicht speichern.")}}
  if(act==="save"){const d=S.draft;d.persons=[document.getElementById("pn0").value.trim()||"Person 1",document.getElementById("pn1").value.trim()||"Person 2"];
    d.tasks.forEach(t=>{t.name=(t.name||"").trim()||"Aufgabe";t.pts=Math.max(0,Math.min(50,t.pts|0));if(t.freq==="week")t.times=Math.max(1,Math.min(14,t.times|0||1));else delete t.times;if(t.owner!=="rot"||(t.pack!=="A"&&t.pack!=="B"))delete t.pack});
    try{await S.store.saveConfig(JSON.parse(JSON.stringify(d)));S.draft=null;toast("Plan gespeichert")}catch(_){toast("Speichern nicht möglich. Bitte Verbindung prüfen.")}}
});
app.addEventListener("change",e=>{const row=e.target.closest(".editrow[data-i]");if(!row||!S.draft)return;const t=S.draft.tasks[+row.dataset.i];const f=e.target.dataset.f;if(!f)return;
  t[f]=(f==="times"||f==="pts")?(+e.target.value||0):e.target.value;if(f==="freq"&&t.freq==="week"&&!t.times)t.times=1;if(f==="freq"||f==="owner")render()});
app.addEventListener("submit",e=>{if(e.target.id!=="shopform")return;e.preventDefault();const v=S.shopText;S.shopText="";const el=document.getElementById("shopinput");if(el)el.value="";shopAdd(v)});
app.addEventListener("input",e=>{if(e.target.id==="shopinput"){S.shopText=e.target.value;return}
  if(S.campDraft){const el=e.target;if(el.dataset.ck){S.campDraft.costs[el.dataset.ck]=+el.value||0;return}const r=el.closest("[data-cx]");if(r&&el.dataset.f){const x=S.campDraft.extras[+r.dataset.cx];x[el.dataset.f]=el.dataset.f==="cost"?(+el.value||0):el.value;return}}
  const row=e.target.closest(".editrow[data-i]");if(!row||!S.draft)return;if(e.target.dataset.f==="name")S.draft.tasks[+row.dataset.i].name=e.target.value});

// ---------- Start ----------
function start(store,mode){S.store=store;S.mode=mode;let gotCfg=false,gotWeeks=false;
  const timer=setTimeout(()=>{S.timedOut=true;if(!gotCfg)S.config=S.config||null;render()},10000);
  store.listen((cfg,fromCache)=>{S.config=cfg;if(!fromCache){gotCfg=true;S.cfgConfirmed=true}if(gotCfg&&gotWeeks){clearTimeout(timer);S.timedOut=false}render()},
    (w,fromCache)=>{S.weeks=w;if(!fromCache)gotWeeks=true;if(gotCfg&&gotWeeks){clearTimeout(timer);S.timedOut=false}render()},
    err=>{clearTimeout(timer);toast("Verbindung zu den gemeinsamen Daten verloren. Seite neu öffnen.")},
    food=>{S.food=food||{};if(S.tab==="essen")render()});
}
function enter(k){S.key=k;try{localStorage.setItem("hq-key",k);history.replaceState(null,"","#k="+k)}catch(e){}
  start(fbStore(SYNC_URL+"/haushalt/"+k),"web");render()}
if(!SYNC_URL)start(localStore(),"local");else{const k=houseKey();if(k)enter(k);else{S.mode="setup";render()}}
window.addEventListener("hashchange",()=>{const m=location.hash.match(/k=([A-Za-z0-9_-]{12,64})/);if(m&&m[1]!==S.key)location.reload()});
})();
</script>

</body></html>
